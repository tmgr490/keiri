<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>経費審査デスク</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ink:#202b36;
    --ink-soft:#586270;
    --ink-faint:#8992a0;
    --paper:#f3efe3;
    --paper-raised:#faf7ee;
    --surface:#fffdf8;
    --line:#e0d8c2;
    --line-strong:#cdc3a6;
    --brand:#1f6b73;
    --brand-ink:#0f4a51;
    --brand-soft:#e2eeee;
    --pending:#6b7280;
    --pending-soft:#eceeef;
    --approved:#2f8a5b;
    --approved-soft:#e3f2e9;
    --returned:#b9791c;
    --returned-soft:#faedd8;
    --rejected:#b23d2c;
    --rejected-soft:#fbe4df;
    --shadow: 0 1px 2px rgba(32,43,54,.06), 0 8px 24px -12px rgba(32,43,54,.25);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#eee9dc;
      --ink-soft:#b7b0a0;
      --ink-faint:#83796a;
      --paper:#181a17;
      --paper-raised:#1f2220;
      --surface:#232622;
      --line:#3a3a33;
      --line-strong:#4c4b41;
      --brand:#5fb8be;
      --brand-ink:#a9dde0;
      --brand-soft:#1d3436;
      --pending:#9aa1ab;
      --pending-soft:#2a2c2c;
      --approved:#6fc794;
      --approved-soft:#1e3226;
      --returned:#e0a94b;
      --returned-soft:#3a2c14;
      --rejected:#e18271;
      --rejected-soft:#3a201a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--brand-soft);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .app{max-width:1280px;margin:0 auto;padding:20px 20px 60px;}

  /* ---------- title bar ---------- */
  .titlebar{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 20px;box-shadow:var(--shadow);margin-bottom:16px;
  }
  .hanko{
    width:38px;height:38px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 35% 30%, var(--rejected) 0%, var(--rejected) 55%, transparent 56%);
    border:2px solid var(--rejected);
    display:flex;align-items:center;justify-content:center;
    color:var(--rejected);font-family:"Shippori Mincho",serif;font-weight:700;font-size:13px;
    opacity:.9;transform:rotate(-6deg);
  }
  .titlebar h1{
    font-family:"Shippori Mincho",serif;font-weight:700;font-size:20px;margin:0;letter-spacing:.02em;
  }
  .titlebar .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .savebadge{margin-left:auto;font-size:11px;color:var(--ink-faint);white-space:nowrap;}
  .savebadge b{color:var(--ink-soft);}
  .titlebar .dots{display:flex;gap:6px;margin-left:14px;}
  .titlebar .dots span{width:9px;height:9px;border-radius:50%;display:block;}
  .dot-a{background:var(--rejected);} .dot-b{background:var(--returned);} .dot-c{background:var(--approved);}

  /* ---------- nav ---------- */
  .nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .navbtn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .navbtn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .navbtn:hover:not(.active){border-color:var(--line-strong);}
  .spacer{flex:1;}
  .btn-primary{
    border:1px solid var(--brand);background:var(--brand);color:#fff;
    padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .btn-primary:hover{background:var(--brand-ink);border-color:var(--brand-ink);}
  .btn-ghost-sm{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .btn-ghost-sm:hover{border-color:var(--line-strong);}

  /* ---------- review layout ---------- */
  .review{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start;}
  @media (max-width: 860px){ .review{grid-template-columns:1fr;} }

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .chip{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:5px;
  }
  .chip .n{font-variant-numeric:tabular-nums;opacity:.75;}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .list{display:flex;flex-direction:column;gap:8px;max-height:74vh;overflow-y:auto;padding-right:2px;}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);
  }
  .card:hover{border-color:var(--line-strong);}
  .card.selected{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-name{font-weight:700;font-size:14px;}
  .card-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .card-amount{font-weight:900;font-size:15.5px;white-space:nowrap;}
  .card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .pill{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;
  }
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;display:block;}
  .pill.st-pending{background:var(--pending-soft);color:var(--pending);}
  .pill.st-pending::before{background:var(--pending);}
  .pill.st-approved{background:var(--approved-soft);color:var(--approved);}
  .pill.st-approved::before{background:var(--approved);}
  .pill.st-returned{background:var(--returned-soft);color:var(--returned);}
  .pill.st-returned::before{background:var(--returned);}
  .pill.st-rejected{background:var(--rejected-soft);color:var(--rejected);}
  .pill.st-rejected::before{background:var(--rejected);}
  .flag{font-size:10.5px;color:var(--rejected);font-weight:700;}

  .empty{
    background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);
    padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;
  }

  /* ---------- detail panel ---------- */
  .detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;min-height:74vh;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px;}
  .detail-title{font-family:"Shippori Mincho",serif;font-size:19px;font-weight:700;}
  .detail-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .detail-amount{font-size:26px;font-weight:900;letter-spacing:-.01em;}
  .memo{background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:16px;white-space:pre-wrap;}
  .receipt-box{margin-bottom:18px;}
  .receipt-box img{max-width:100%;max-height:280px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block;}
  .receipt-none{font-size:12.5px;color:var(--rejected);background:var(--rejected-soft);border-radius:8px;padding:10px 14px;display:inline-block;}
  .history{font-size:12.5px;color:var(--ink-soft);background:var(--paper-raised);border-left:3px solid var(--line-strong);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:16px;}
  .actions{border-top:1px solid var(--line);padding-top:16px;}
  .actions label{font-size:11px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em;display:block;margin-bottom:6px;}
  textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;
    background:var(--paper-raised);color:var(--ink);resize:vertical;min-height:56px;margin-bottom:12px;
  }
  .act-row{display:flex;gap:8px;flex-wrap:wrap;}
  .act-btn{
    border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid transparent;
  }
  .act-approve{background:var(--approved);color:#fff;}
  .act-approve:hover{filter:brightness(0.92);}
  .act-return{background:var(--returned-soft);color:var(--returned);border-color:var(--returned);}
  .act-return:hover{background:var(--returned);color:#fff;}
  .act-reject{background:var(--rejected-soft);color:var(--rejected);border-color:var(--rejected);}
  .act-reject:hover{background:var(--rejected);color:#fff;}
  .placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-faint);font-size:13.5px;min-height:60vh;}

  /* ---------- dashboard ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  @media (max-width: 860px){ .kpis{grid-template-columns:repeat(2,1fr);} }
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .kpi .lbl{font-size:11.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em;margin-bottom:6px;}
  .kpi .val{font-size:24px;font-weight:900;}
  .kpi .sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .kpi.warn .val{color:var(--returned);}
  .panels{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  @media (max-width: 860px){ .panels{grid-template-columns:1fr;} }
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
  .panel h3{font-family:"Shippori Mincho",serif;font-size:15.5px;margin:0 0 14px;font-weight:700;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .bar-label{width:74px;flex:none;font-size:12px;color:var(--ink-soft);text-align:right;}
  .bar-track{flex:1;background:var(--paper-raised);border-radius:4px;height:16px;position:relative;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;background:var(--brand);}
  .bar-val{width:88px;flex:none;font-size:12px;font-weight:700;text-align:right;}
  .status-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
  .status-row .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .status-row .cnt{margin-left:auto;font-weight:800;}
  svg text{font-family:"Zen Kaku Gothic New",sans-serif;fill:var(--ink-soft);}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,22,18,.5);display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--surface);border-radius:14px;border:1px solid var(--line);max-width:560px;width:100%;
    max-height:88vh;overflow-y:auto;padding:24px 26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
  }
  .modal h2{font-family:"Shippori Mincho",serif;font-size:19px;margin:0 0 16px;}
  .form-row{margin-bottom:13px;}
  .form-row label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .form-row input[type=text],.form-row input[type=date],.form-row input[type=number],.form-row select,.form-row textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;background:var(--paper-raised);color:var(--ink);
  }
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .file-drop{border:1.5px dashed var(--line-strong);border-radius:8px;padding:16px;text-align:center;font-size:12.5px;color:var(--ink-soft);cursor:pointer;background:var(--paper-raised);}
  .file-drop img{max-height:120px;border-radius:6px;margin-top:8px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .btn-ghost{border:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;}

  .lightbox{position:fixed;inset:0;background:rgba(10,10,8,.86);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out;padding:30px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:6px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:20px;font-size:12.5px;font-weight:700;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:70;
    max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<div class="app" id="app"></div>

<div class="overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt="領収書拡大"></div>
<div class="toast" id="toast"></div>

<input type="file" id="restoreFile" accept="application/json" style="display:none">

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "keihiShinsaState.v1";

  /* ================= constants ================= */
  var CATEGORIES = ["交通費","会議費","交際費","消耗品費","通信費","宿泊費","書籍・研修費","その他"];
  var STATUS = {
    pending:  {label:"未処理", cls:"st-pending"},
    approved: {label:"承認",   cls:"st-approved"},
    returned: {label:"差戻",   cls:"st-returned"},
    rejected: {label:"却下",   cls:"st-rejected"}
  };

  /* ================= state ================= */
  var STATE = { expenses: [] };
  var lastSavedAt = null;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) STATE = JSON.parse(raw);
  } catch(e){ STATE = { expenses: [] }; }
  if (!STATE.expenses) STATE.expenses = [];

  var ui = { view: "review", filter: "all", selectedId: null };
  var saveTimer = null;

  /* ================= helpers ================= */
  function uid(){ return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function yen(n){ return "¥" + Math.round(n||0).toLocaleString("ja-JP"); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmtDate(d){ if(!d) return "—"; var p=d.split("-"); return p.length===3 ? p[0]+"/"+p[1]+"/"+p[2] : d; }
  function fmtTime(d){ if(!d) return ""; var h=String(d.getHours()).padStart(2,"0"),m=String(d.getMinutes()).padStart(2,"0"),s=String(d.getSeconds()).padStart(2,"0"); return h+":"+m+":"+s; }
  function monthKey(d){ return d ? d.slice(0,7) : "不明"; }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  function byId(id){ return STATE.expenses.find(function(e){ return e.id===id; }); }
  function sorted(){ return STATE.expenses.slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||"") || b.createdAt-a.createdAt; }); }
  function counts(){
    var c = {all: STATE.expenses.length, pending:0, approved:0, returned:0, rejected:0};
    STATE.expenses.forEach(function(e){ c[e.status] = (c[e.status]||0)+1; });
    return c;
  }

  /* ================= rendering ================= */
  function renderApp(){
    var c = counts();
    var html = '';
    html += '<div class="titlebar">' +
      '<div class="hanko">済</div>' +
      '<div><h1>経費審査デスク</h1><div class="sub">Keihi Shinsa Desk — 経費申請の確認・承認ワークフロー（このPC内に保存）</div></div>' +
      '<div class="savebadge" id="saveBadge">' + saveBadgeText() + '</div>' +
      '<div class="dots"><span class="dot-a"></span><span class="dot-b"></span><span class="dot-c"></span></div>' +
      '</div>';

    html += '<div class="nav">' +
      navBtn('review','審査キュー') + navBtn('dashboard','月次ダッシュボード') +
      '<div class="spacer"></div>' +
      '<button class="btn-ghost-sm" id="btnExport">バックアップを保存</button>' +
      '<button class="btn-ghost-sm" id="btnImport">バックアップを読み込む</button>' +
      '<button class="btn-primary" id="btnNew">＋ 新規申請を登録</button>' +
      '</div>';

    html += ui.view === 'review' ? renderReview(c) : renderDashboard();
    document.getElementById('app').innerHTML = html;
    bindEvents();
  }

  function saveBadgeText(){
    return lastSavedAt ? ('最終保存 <b>' + fmtTime(lastSavedAt) + '</b>') : 'まだ保存されていません';
  }

  function navBtn(key,label){
    return '<button class="navbtn' + (ui.view===key?' active':'') + '" data-nav="' + key + '">' + label + '</button>';
  }

  function renderReview(c){
    var list = sorted().filter(function(e){ return ui.filter==='all' ? true : e.status===ui.filter; });
    var chips = [['all','すべて',c.all],['pending','未処理',c.pending],['returned','差戻',c.returned],['rejected','却下',c.rejected],['approved','承認',c.approved]];

    var out = '<div class="review"><div>';
    out += '<div class="filters">' + chips.map(function(ch){
      return '<button class="chip' + (ui.filter===ch[0]?' active':'') + '" data-filter="' + ch[0] + '">' + ch[1] + ' <span class="n">' + ch[2] + '</span></button>';
    }).join('') + '</div>';

    if (!list.length) {
      out += '<div class="empty">' + (STATE.expenses.length ? 'このステータスの申請はありません。' : 'まだ申請がありません。「＋ 新規申請を登録」から追加してください。') + '</div>';
    } else {
      out += '<div class="list">' + list.map(cardHTML).join('') + '</div>';
    }
    out += '</div>';
    out += '<div>' + (ui.selectedId && byId(ui.selectedId) ? detailHTML(byId(ui.selectedId)) : '<div class="detail"><div class="placeholder">左の一覧から申請を選択してください</div></div>') + '</div>';
    out += '</div>';
    return out;
  }

  function cardHTML(e){
    var st = STATUS[e.status];
    return '<div class="card' + (ui.selectedId===e.id?' selected':'') + '" data-select="' + e.id + '">' +
      '<div class="card-top"><div><div class="card-name">' + esc(e.submitter) + '</div>' +
      '<div class="card-meta">' + fmtDate(e.date) + ' ・ ' + esc(e.department) + ' ・ ' + esc(e.category) + '</div></div>' +
      '<div class="card-amount">' + yen(e.amount) + '</div></div>' +
      '<div class="card-bottom"><span class="pill ' + st.cls + '">' + st.label + '</span>' +
      (e.receipt ? '' : '<span class="flag">領収書なし</span>') + '</div></div>';
  }

  function detailHTML(e){
    var st = STATUS[e.status];
    var out = '<div class="detail">';
    out += '<div class="detail-head"><div><div class="detail-title">' + esc(e.submitter) + ' さんの申請</div>' +
      '<div class="detail-sub">' + fmtDate(e.date) + ' ・ ' + esc(e.department) + ' ・ ' + esc(e.category) + ' ・ <span class="pill ' + st.cls + '">' + st.label + '</span></div></div>' +
      '<div class="detail-amount">' + yen(e.amount) + '</div></div>';

    out += '<div class="receipt-box">' + (e.receipt ?
      '<img src="' + e.receipt + '" data-zoom="1" alt="領収書">' :
      '<span class="receipt-none">領収書画像が添付されていません</span>') + '</div>';

    out += '<div class="memo">' + (e.memo ? esc(e.memo) : '（メモなし）') + '</div>';

    if (e.reviewComment) {
      out += '<div class="history">前回の審査コメント（' + esc(st.label) + (e.reviewedAt ? '・' + fmtDate(e.reviewedAt) : '') + '）：' + esc(e.reviewComment) + '</div>';
    }

    out += '<div class="actions"><label for="reviewNote">審査コメント（差戻・却下時は入力必須）</label>' +
      '<textarea id="reviewNote" placeholder="例）宛名がないため再提出をお願いします"></textarea>' +
      '<div class="act-row">' +
      actBtn('approve','act-approve','承認する') +
      actBtn('return','act-return','差し戻す') +
      actBtn('reject','act-reject','却下する') +
      '</div></div>';
    out += '</div>';
    return out;
  }
  function actBtn(action,cls,label){
    return '<button class="act-btn ' + cls + '" data-action="' + action + '">' + label + '</button>';
  }

  function renderDashboard(){
    var list = STATE.expenses;
    if (!list.length) return '<div class="empty">データがまだありません。申請を登録すると、ここに月次集計が表示されます。</div>';

    var totalAmt = list.reduce(function(s,e){ return s+(e.amount||0); },0);
    var approvedAmt = list.filter(function(e){return e.status==='approved';}).reduce(function(s,e){ return s+(e.amount||0); },0);
    var flagged = list.filter(function(e){ return e.status==='returned' || e.status==='rejected'; }).length;
    var flagRate = list.length ? Math.round(flagged/list.length*100) : 0;

    var byMonth = {};
    list.forEach(function(e){ var k=monthKey(e.date); byMonth[k]=(byMonth[k]||0)+(e.amount||0); });
    var months = Object.keys(byMonth).sort();
    var maxMonth = Math.max.apply(null, months.map(function(m){return byMonth[m];}).concat([1]));

    var byDept = {};
    list.forEach(function(e){ var k=e.department||'未分類'; byDept[k]=(byDept[k]||0)+(e.amount||0); });
    var depts = Object.keys(byDept).sort(function(a,b){ return byDept[b]-byDept[a]; });
    var maxDept = Math.max.apply(null, depts.map(function(d){return byDept[d];}).concat([1]));

    var c = counts();

    var out = '<div class="kpis">' +
      kpi('総申請件数', c.all + ' 件', '') +
      kpi('申請総額', yen(totalAmt), '') +
      kpi('承認済み金額', yen(approvedAmt), c.approved + ' 件承認済み') +
      kpi('差戻・却下率', flagRate + '%', flagged + ' / ' + c.all + ' 件が要注意', flagRate>=20) +
      '</div>';

    out += '<div class="panels"><div class="panel"><h3>月次申請額の推移</h3>' + barChartSVG(months, byMonth, maxMonth) + '</div>';

    out += '<div class="panel"><h3>部署別 申請額</h3>';
    depts.forEach(function(d){
      var pct = Math.round(byDept[d]/maxDept*100);
      out += '<div class="bar-row"><div class="bar-label">' + esc(d) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="bar-val">' + yen(byDept[d]) + '</div></div>';
    });
    out += '<h3 style="margin-top:20px">ステータス内訳</h3>';
    ['pending','approved','returned','rejected'].forEach(function(k){
      out += '<div class="status-row"><span class="dot" style="background:var(--' + k + ')"></span>' + STATUS[k].label + '<span class="cnt">' + (c[k]||0) + ' 件</span></div>';
    });
    out += '</div></div>';
    return out;
  }

  function kpi(label,val,sub,warn){
    return '<div class="kpi' + (warn?' warn':'') + '"><div class="lbl">' + label + '</div><div class="val">' + val + '</div>' + (sub?'<div class="sub">'+sub+'</div>':'') + '</div>';
  }

  function barChartSVG(months, byMonth, maxMonth){
    if (!months.length) return '<div class="empty">データなし</div>';
    var w = 560, h = 200, padL = 8, padB = 26, padT = 10;
    var bw = (w - padL*2) / months.length;
    var barW = Math.min(38, bw*0.55);
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;max-height:220px" role="img" aria-label="月次申請額の棒グラフ">';
    svg += '<line x1="' + padL + '" y1="' + (h-padB) + '" x2="' + (w-padL) + '" y2="' + (h-padB) + '" stroke="var(--line)" stroke-width="1"/>';
    months.forEach(function(m, i){
      var val = byMonth[m];
      var bh = Math.max(3, (val/maxMonth) * (h-padT-padB));
      var x = padL + i*bw + (bw-barW)/2;
      var y = (h-padB) - bh;
      svg += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="4" fill="var(--brand)"><title>' + m + '：' + yen(val) + '</title></rect>';
      svg += '<text x="' + (x+barW/2).toFixed(1) + '" y="' + (h-padB+16) + '" font-size="10.5" text-anchor="middle">' + m.slice(5) + '月</text>';
    });
    svg += '</svg>';
    return svg;
  }

  /* ================= modal: new expense ================= */
  function openNewModal(){
    var today = new Date().toISOString().slice(0,10);
    var body = '<h2>新規経費申請</h2>' +
      '<div class="form-row"><label>申請日</label><input type="date" id="f-date" value="' + today + '"></div>' +
      '<div class="form-2col">' +
      '<div class="form-row"><label>申請者名</label><input type="text" id="f-submitter" placeholder="例）森若沙名子"></div>' +
      '<div class="form-row"><label>部署</label><input type="text" id="f-department" placeholder="例）営業部"></div>' +
      '</div>' +
      '<div class="form-2col">' +
      '<div class="form-row"><label>費目</label><select id="f-category">' + CATEGORIES.map(function(c){return '<option>'+c+'</option>';}).join('') + '</select></div>' +
      '<div class="form-row"><label>金額（円）</label><input type="number" id="f-amount" min="0" step="1" placeholder="0"></div>' +
      '</div>' +
      '<div class="form-row"><label>メモ・用途</label><textarea id="f-memo" rows="3" placeholder="例）〇〇社との定例打ち合わせ費用"></textarea></div>' +
      '<div class="form-row"><label>領収書画像</label><div class="file-drop" id="f-dropzone">クリックして画像を選択<div id="f-preview"></div></div><input type="file" id="f-file" accept="image/*" style="display:none"></div>' +
      '<div class="modal-actions"><button class="btn-ghost" id="f-cancel">キャンセル</button><button class="btn-primary" id="f-submit">登録する</button></div>';
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalOverlay').classList.add('show');

    var receiptData = null;
    document.getElementById('f-dropzone').onclick = function(){ document.getElementById('f-file').click(); };
    document.getElementById('f-file').onchange = function(ev){
      var file = ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        receiptData = reader.result;
        document.getElementById('f-preview').innerHTML = '<img src="' + receiptData + '" alt="プレビュー">';
      };
      reader.readAsDataURL(file);
    };
    document.getElementById('f-cancel').onclick = closeModal;
    document.getElementById('f-submit').onclick = function(){
      var submitter = document.getElementById('f-submitter').value.trim();
      var amount = parseFloat(document.getElementById('f-amount').value);
      if (!submitter) { toast('申請者名を入力してください'); return; }
      if (!amount || amount<=0) { toast('金額を正しく入力してください'); return; }
      var e = {
        id: uid(),
        date: document.getElementById('f-date').value,
        submitter: submitter,
        department: document.getElementById('f-department').value.trim() || '未設定',
        category: document.getElementById('f-category').value,
        amount: amount,
        memo: document.getElementById('f-memo').value.trim(),
        receipt: receiptData,
        status: 'pending',
        reviewComment: '',
        reviewedAt: null,
        createdAt: Date.now()
      };
      STATE.expenses.push(e);
      closeModal();
      ui.selectedId = e.id; ui.filter = 'all'; ui.view='review';
      renderApp();
      saveState('新規申請を登録しました');
    };
  }
  function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); document.getElementById('modalBody').innerHTML=''; }

  /* ================= actions ================= */
  function doAction(action){
    var e = byId(ui.selectedId);
    if (!e) return;
    var note = (document.getElementById('reviewNote')||{}).value || '';
    note = note.trim();
    if ((action==='return' || action==='reject') && !note) {
      toast('差し戻し・却下の理由を入力してください'); return;
    }
    e.status = action==='approve' ? 'approved' : action==='return' ? 'returned' : 'rejected';
    e.reviewComment = note;
    e.reviewedAt = new Date().toISOString().slice(0,10);
    renderApp();
    saveState('ステータスを「' + STATUS[e.status].label + '」に更新しました');
  }

  /* ================= backup: export / import ================= */
  function exportBackup(){
    try {
      var json = JSON.stringify(STATE, null, 2);
      var blob = new Blob([json], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
      a.href = url;
      a.download = "keihi-shinsa-backup-" + ts + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast("バックアップファイルをダウンロードしました");
    } catch(e){
      toast("バックアップの作成に失敗しました");
    }
  }

  function importBackup(file){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.expenses)) throw new Error("invalid");
        var ok = window.confirm("バックアップを読み込むと、現在のデータは上書きされます。よろしいですか？");
        if (!ok) return;
        STATE = data;
        ui.selectedId = null;
        renderApp();
        saveState("バックアップから復元しました（" + STATE.expenses.length + " 件）");
      } catch(e){
        toast("読み込みに失敗しました。正しいバックアップファイルか確認してください");
      }
    };
    reader.readAsText(file);
  }

  /* ================= events ================= */
  function bindEvents(){
    document.querySelectorAll('[data-nav]').forEach(function(b){
      b.onclick = function(){ ui.view = b.getAttribute('data-nav'); renderApp(); };
    });
    document.querySelectorAll('[data-filter]').forEach(function(b){
      b.onclick = function(){ ui.filter = b.getAttribute('data-filter'); renderApp(); };
    });
    document.querySelectorAll('[data-select]').forEach(function(b){
      b.onclick = function(){ ui.selectedId = b.getAttribute('data-select'); renderApp(); };
    });
    document.querySelectorAll('[data-action]').forEach(function(b){
      b.onclick = function(){ doAction(b.getAttribute('data-action')); };
    });
    var zoomImg = document.querySelector('[data-zoom]');
    if (zoomImg) zoomImg.onclick = function(){
      document.getElementById('lightboxImg').src = zoomImg.src;
      document.getElementById('lightbox').classList.add('show');
    };
    var btnNew = document.getElementById('btnNew');
    if (btnNew) btnNew.onclick = openNewModal;
    var btnExport = document.getElementById('btnExport');
    if (btnExport) btnExport.onclick = exportBackup;
    var btnImport = document.getElementById('btnImport');
    if (btnImport) btnImport.onclick = function(){ document.getElementById('restoreFile').click(); };
  }
  document.getElementById('modalOverlay').addEventListener('click', function(ev){
    if (ev.target.id === 'modalOverlay') closeModal();
  });
  document.getElementById('lightbox').addEventListener('click', function(){
    document.getElementById('lightbox').classList.remove('show');
  });
  document.getElementById('restoreFile').addEventListener('change', function(ev){
    var file = ev.target.files[0];
    if (file) importBackup(file);
    ev.target.value = "";
  });

  /* ================= persistence (localStorage) ================= */
  function saveState(msg){
    if (msg) toast(msg);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 400);
  }

  function doSave(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      lastSavedAt = new Date();
      var badge = document.getElementById('saveBadge');
      if (badge) badge.innerHTML = saveBadgeText();
    } catch(e){
      toast("保存容量の上限に達した可能性があります。バックアップを保存してください");
    }
  }

  /* ================= init ================= */
  renderApp();
})();
</script>
</body>
</html>
