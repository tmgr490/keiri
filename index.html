<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支出審査デスク</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ink:#202b36;
    --ink-soft:#586270;
    --ink-faint:#8992a0;
    --paper:#f3efe3;
    --paper-raised:#faf7ee;
    --surface:#fffdf8;
    --line:#e0d8c2;
    --line-strong:#cdc3a6;
    --brand:#1f6b73;
    --brand-ink:#0f4a51;
    --brand-soft:#e2eeee;
    --pending:#6b7280;
    --pending-soft:#eceeef;
    --approved:#2f8a5b;
    --approved-soft:#e3f2e9;
    --returned:#b9791c;
    --returned-soft:#faedd8;
    --rejected:#b23d2c;
    --rejected-soft:#fbe4df;
    --shadow: 0 1px 2px rgba(32,43,54,.06), 0 8px 24px -12px rgba(32,43,54,.25);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#eee9dc;
      --ink-soft:#b7b0a0;
      --ink-faint:#83796a;
      --paper:#181a17;
      --paper-raised:#1f2220;
      --surface:#232622;
      --line:#3a3a33;
      --line-strong:#4c4b41;
      --brand:#5fb8be;
      --brand-ink:#a9dde0;
      --brand-soft:#1d3436;
      --pending:#9aa1ab;
      --pending-soft:#2a2c2c;
      --approved:#6fc794;
      --approved-soft:#1e3226;
      --returned:#e0a94b;
      --returned-soft:#3a2c14;
      --rejected:#e18271;
      --rejected-soft:#3a201a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--brand-soft);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .app{max-width:1280px;margin:0 auto;padding:20px 20px 60px;}

  /* ---------- title bar ---------- */
  .titlebar{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 20px;box-shadow:var(--shadow);margin-bottom:16px;
  }
  .hanko{
    width:38px;height:38px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 35% 30%, var(--rejected) 0%, var(--rejected) 55%, transparent 56%);
    border:2px solid var(--rejected);
    display:flex;align-items:center;justify-content:center;
    color:var(--rejected);font-family:"Shippori Mincho",serif;font-weight:700;font-size:13px;
    opacity:.9;transform:rotate(-6deg);
  }
  .titlebar h1{
    font-family:"Shippori Mincho",serif;font-weight:700;font-size:20px;margin:0;letter-spacing:.02em;
  }
  .titlebar .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .savebadge{margin-left:auto;font-size:11px;color:var(--ink-faint);white-space:nowrap;}
  .savebadge b{color:var(--ink-soft);}
  .titlebar .dots{display:flex;gap:6px;margin-left:14px;}
  .titlebar .dots span{width:9px;height:9px;border-radius:50%;display:block;}
  .dot-a{background:var(--rejected);} .dot-b{background:var(--returned);} .dot-c{background:var(--approved);}

  /* ---------- nav ---------- */
  .nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .navbtn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .navbtn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .navbtn:hover:not(.active){border-color:var(--line-strong);}
  .spacer{flex:1;}
  .btn-primary{
    border:1px solid var(--brand);background:var(--brand);color:#fff;
    padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .btn-primary:hover{background:var(--brand-ink);border-color:var(--brand-ink);}
  .btn-ghost-sm{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .btn-ghost-sm:hover{border-color:var(--line-strong);}

  /* ---------- review layout ---------- */
  .review{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start;}
  @media (max-width: 860px){ .review{grid-template-columns:1fr;} }

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .chip{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:5px;
  }
  .chip .n{font-variant-numeric:tabular-nums;opacity:.75;}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .list{display:flex;flex-direction:column;gap:8px;max-height:74vh;overflow-y:auto;padding-right:2px;}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);
  }
  .card:hover{border-color:var(--line-strong);}
  .card.selected{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-name{font-weight:700;font-size:14px;}
  .card-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .card-amount{font-weight:900;font-size:15.5px;white-space:nowrap;}
  .card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .pill{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;
  }
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;display:block;}
  .pill.st-pending{background:var(--pending-soft);color:var(--pending);}
  .pill.st-pending::before{background:var(--pending);}
  .pill.st-approved{background:var(--approved-soft);color:var(--approved);}
  .pill.st-approved::before{background:var(--approved);}
  .pill.st-returned{background:var(--returned-soft);color:var(--returned);}
  .pill.st-returned::before{background:var(--returned);}
  .pill.st-rejected{background:var(--rejected-soft);color:var(--rejected);}
  .pill.st-rejected::before{background:var(--rejected);}
  .flag{font-size:10.5px;color:var(--rejected);font-weight:700;}

  .empty{
    background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);
    padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;
  }

  /* ---------- detail panel ---------- */
  .detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;min-height:74vh;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px;}
  .detail-title{font-family:"Shippori Mincho",serif;font-size:19px;font-weight:700;}
  .detail-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .detail-amount{font-size:26px;font-weight:900;letter-spacing:-.01em;}
  .budget-ctx{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:10px 14px;
    font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;
  }
  .budget-ctx b{color:var(--ink);}
  .budget-ctx .mini-track{background:var(--line);border-radius:4px;height:6px;margin-top:6px;overflow:hidden;}
  .budget-ctx .mini-fill{height:100%;border-radius:4px;}
  .memo{background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:16px;white-space:pre-wrap;}
  .receipt-box{margin-bottom:18px;}
  .receipt-box img{max-width:100%;max-height:280px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block;}
  .receipt-none{font-size:12.5px;color:var(--rejected);background:var(--rejected-soft);border-radius:8px;padding:10px 14px;display:inline-block;}
  .history{font-size:12.5px;color:var(--ink-soft);background:var(--paper-raised);border-left:3px solid var(--line-strong);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:16px;}
  .actions{border-top:1px solid var(--line);padding-top:16px;}
  .actions label{font-size:11px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em;display:block;margin-bottom:6px;}
  textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;
    background:var(--paper-raised);color:var(--ink);resize:vertical;min-height:56px;margin-bottom:12px;
  }
  .act-row{display:flex;gap:8px;flex-wrap:wrap;}
  .act-btn{
    border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid transparent;
  }
  .act-approve{background:var(--approved);color:#fff;}
  .act-approve:hover{filter:brightness(0.92);}
  .act-return{background:var(--returned-soft);color:var(--returned);border-color:var(--returned);}
  .act-return:hover{background:var(--returned);color:#fff;}
  .act-reject{background:var(--rejected-soft);color:var(--rejected);border-color:var(--rejected);}
  .act-reject:hover{background:var(--rejected);color:#fff;}
  .placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-faint);font-size:13.5px;min-height:60vh;}

  /* ---------- dashboard ---------- */
  .dash-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .dash-toolbar label{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .dash-toolbar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--surface);color:var(--ink);}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  @media (max-width: 860px){ .kpis{grid-template-columns:repeat(2,1fr);} }
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .kpi .lbl{font-size:11.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em;margin-bottom:6px;}
  .kpi .val{font-size:24px;font-weight:900;}
  .kpi .sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .kpi.warn .val{color:var(--returned);}
  .kpi.bad .val{color:var(--rejected);}
  .panels{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  @media (max-width: 860px){ .panels{grid-template-columns:1fr;} }
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
  .panel h3{font-family:"Shippori Mincho",serif;font-size:15.5px;margin:0 0 14px;font-weight:700;}
  .budget-row{margin-bottom:14px;}
  .budget-row-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .budget-row-top .cat{font-weight:700;color:var(--ink);}
  .budget-row-top .amt{color:var(--ink-soft);}
  .budget-row-top .amt b{color:var(--ink);font-weight:700;}
  .budget-track{background:var(--paper-raised);border-radius:4px;height:14px;position:relative;overflow:hidden;}
  .budget-fill{height:100%;border-radius:4px;}
  .budget-pct{font-size:11px;color:var(--ink-faint);margin-top:3px;}
  .status-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
  .status-row .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .status-row .cnt{margin-left:auto;font-weight:800;}
  svg text{font-family:"Zen Kaku Gothic New",sans-serif;fill:var(--ink-soft);}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,22,18,.5);display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--surface);border-radius:14px;border:1px solid var(--line);max-width:560px;width:100%;
    max-height:88vh;overflow-y:auto;padding:24px 26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
  }
  .modal h2{font-family:"Shippori Mincho",serif;font-size:19px;margin:0 0 6px;}
  .modal .modal-desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .form-row{margin-bottom:13px;}
  .form-row label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .form-row input[type=text],.form-row input[type=date],.form-row input[type=number],.form-row select,.form-row textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;background:var(--paper-raised);color:var(--ink);
  }
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .file-drop{border:1.5px dashed var(--line-strong);border-radius:8px;padding:16px;text-align:center;font-size:12.5px;color:var(--ink-soft);cursor:pointer;background:var(--paper-raised);}
  .file-drop img{max-height:120px;border-radius:6px;margin-top:8px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .btn-ghost{border:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .budget-form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .budget-form-row .cat{width:120px;flex:none;font-size:13px;font-weight:700;}
  .budget-form-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;background:var(--paper-raised);color:var(--ink);}
  .budget-form-row .yen{color:var(--ink-faint);font-size:12.5px;}
  .cat-del{
    flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-faint);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .cat-del:hover{background:var(--rejected-soft);color:var(--rejected);border-color:var(--rejected);}
  .cat-add-row{display:flex;gap:8px;margin-bottom:16px;}
  .cat-add-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;background:var(--paper-raised);color:var(--ink);}

  .lightbox{position:fixed;inset:0;background:rgba(10,10,8,.86);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out;padding:30px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:6px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:20px;font-size:12.5px;font-weight:700;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:70;
    max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<div class="app" id="app"></div>

<div class="overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt="領収書拡大"></div>
<div class="toast" id="toast"></div>

<input type="file" id="restoreFile" accept="application/json" style="display:none">
<input type="file" id="salaryImportFile" accept="application/json" style="display:none">

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "keihiShinsaState.v1";

  /* ================= constants ================= */
  var DEFAULT_CATEGORIES = ["食費","交際費","娯楽費","交通費","日用品","通信費","書籍・学用品","衣服・美容","医療費","その他"];
  var STATUS = {
    pending:  {label:"未審査", cls:"st-pending"},
    approved: {label:"承認",   cls:"st-approved"},
    returned: {label:"要注意", cls:"st-returned"},
    rejected: {label:"却下",   cls:"st-rejected"}
  };

  /* ================= state ================= */
  var STATE = { expenses: [], budgets: {} };
  var lastSavedAt = null;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) STATE = JSON.parse(raw);
  } catch(e){ STATE = { expenses: [], budgets: {} }; }
  if (!STATE.expenses) STATE.expenses = [];
  if (!STATE.budgets) STATE.budgets = {};
  if (!STATE.categories || !STATE.categories.length) STATE.categories = DEFAULT_CATEGORIES.slice();
  if (!STATE.incomes) STATE.incomes = [];

  var ui = { view: "review", filter: "all", selectedId: null, dashMonth: new Date().toISOString().slice(0,7) };
  var saveTimer = null;

  /* ================= helpers ================= */
  function uid(){ return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function yen(n){ return "¥" + Math.round(n||0).toLocaleString("ja-JP"); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmtDate(d){ if(!d) return "—"; var p=d.split("-"); return p.length===3 ? p[0]+"/"+p[1]+"/"+p[2] : d; }
  function fmtTime(d){ if(!d) return ""; var h=String(d.getHours()).padStart(2,"0"),m=String(d.getMinutes()).padStart(2,"0"),s=String(d.getSeconds()).padStart(2,"0"); return h+":"+m+":"+s; }
  function monthKey(d){ return d ? d.slice(0,7) : "不明"; }
  function monthLabel(m){ var p=m.split("-"); return p.length===2 ? p[0]+"年"+parseInt(p[1],10)+"月" : m; }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }
  function pctColorVar(pct){
    if (pct >= 100) return "rejected";
    if (pct >= 80) return "returned";
    return "brand";
  }

  function byId(id){ return STATE.expenses.find(function(e){ return e.id===id; }); }
  function sorted(){ return STATE.expenses.slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||"") || b.createdAt-a.createdAt; }); }
  function incomeById(id){ return STATE.incomes.find(function(e){ return e.id===id; }); }
  function sortedIncomes(){ return STATE.incomes.slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||"") || b.createdAt-a.createdAt; }); }
  function incomeInMonth(month){ return STATE.incomes.filter(function(e){ return monthKey(e.date)===month; }).reduce(function(s,e){ return s+(e.amount||0); },0); }
  function counts(){
    var c = {all: STATE.expenses.length, pending:0, approved:0, returned:0, rejected:0};
    STATE.expenses.forEach(function(e){ c[e.status] = (c[e.status]||0)+1; });
    return c;
  }
  function spentInMonth(cat, month){
    return STATE.expenses.filter(function(e){ return e.category===cat && monthKey(e.date)===month; })
      .reduce(function(s,e){ return s+(e.amount||0); },0);
  }
  function availableMonths(){
    var set = {};
    STATE.expenses.forEach(function(e){ set[monthKey(e.date)] = true; });
    set[ui.dashMonth] = true;
    set[new Date().toISOString().slice(0,7)] = true;
    return Object.keys(set).sort().reverse();
  }
  function allCategoryNames(){
    var set = {};
    STATE.categories.forEach(function(c){ set[c] = true; });
    STATE.expenses.forEach(function(e){ if (e.category) set[e.category] = true; });
    return Object.keys(set);
  }

  /* ================= rendering ================= */
  function renderApp(){
    var c = counts();
    var html = '';
    html += '<div class="titlebar">' +
      '<div class="hanko">済</div>' +
      '<div><h1>支出審査デスク</h1><div class="sub">自分の支出を、月の予算と照らして自分で審査する管理ツール（このPC内に保存）</div></div>' +
      '<div class="savebadge" id="saveBadge">' + saveBadgeText() + '</div>' +
      '<div class="dots"><span class="dot-a"></span><span class="dot-b"></span><span class="dot-c"></span></div>' +
      '</div>';

    html += '<div class="nav">' +
      navBtn('review','審査キュー') + navBtn('income','収入') + navBtn('dashboard','予算ダッシュボード') +
      '<div class="spacer"></div>' +
      (ui.view === 'income'
        ? '<button class="btn-ghost-sm" id="btnSalaryImport">給与トラッカーを読み込む</button><button class="btn-primary" id="btnNewIncome">＋ 新規収入を記録</button>'
        : '<button class="btn-ghost-sm" id="btnBudget">予算を設定</button>' +
          '<button class="btn-ghost-sm" id="btnCsv">CSVエクスポート</button>' +
          '<button class="btn-ghost-sm" id="btnExport">バックアップを保存</button>' +

  /* ================= salary tracker import ================= */
  /* シンプル化: 給与サイクルの締め日・支払日は再現せず、
     「その月に発生した給与（時給計算分の交通費こみ）」を月ごとに1件の収入としてまとめるだけにする。 */
  function importSalaryTracker(data){
    var jobs = data.jobs || [];
    var shifts = data.shifts || [];
    var actualPayments = data.actualPayments || [];
    var holidays = data.holidays || {};

    function parseYMD(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
    function isSunday(d){ return d.getDay()===0; }
    function isHoliday(k){ return !!holidays[k]; }
    function dayType(k){ var d=parseYMD(k); return (isSunday(d)||isHoliday(k)) ? 'holiday' : 'weekday'; }
    function timeToHours(t){ var p=t.split(':').map(Number); return p[0]+p[1]/60; }
    function rateForHour(hour, type, job){
      var band = job.wageBands.filter(function(b){ var bs=timeToHours(b.start), be=timeToHours(b.end); return hour>=bs && hour<be; })[0];
      var rate = job.baseWage + (band ? (Number(band.addon)||0) : 0);
      return type==='holiday' ? rate + job.sunAdd : rate;
    }
    function bandBoundariesInRange(start,end,job){
      var points = {};
      job.wageBands.forEach(function(b){
        var bs=timeToHours(b.start), be=timeToHours(b.end);
        if (bs>start && bs<end) points[bs]=true;
        if (be>start && be<end) points[be]=true;
      });
      return Object.keys(points).map(Number);
    }
    function calcShiftWage(shift, job){
      var type = dayType(shift.date);
      var start = timeToHours(shift.start), end = timeToHours(shift.end);
      if (end<=start) end += 24;
      var breakHours = (shift.breakMin||0)/60;
      var points = [start].concat(bandBoundariesInRange(start,end,job)).concat([end]);
      points = Array.from(new Set(points)).sort(function(a,b){return a-b;});
      var totalPay=0, totalHours=0;
      for (var i=0;i<points.length-1;i++){
        var segStart=points[i], segEnd=points[i+1];
        var dur = segEnd-segStart;
        var rate = rateForHour(segStart % 24, type, job);
        totalPay += rate*dur; totalHours += dur;
      }
      if (breakHours>0 && totalHours>0){
        var avgRate = totalPay/totalHours;
        totalPay -= avgRate*breakHours; totalHours -= breakHours;
      }
      return Math.round(totalPay);
    }

    var results = [];

    jobs.forEach(function(job){
      var jobShifts = shifts.filter(function(s){ return s.jobId===job.id; });
      var byMonth = {};
      jobShifts.forEach(function(s){
        var m = s.date.slice(0,7);
        if (!byMonth[m]) byMonth[m] = [];
        byMonth[m].push(s);
      });
      Object.keys(byMonth).forEach(function(month){
        var group = byMonth[month];
        var workDays = Array.from(new Set(group.map(function(s){ return s.date; }))).length;
        var wage = group.reduce(function(sum,s){ return sum + calcShiftWage(s, job); }, 0);
        var usePass = workDays >= job.passThreshold;
        var commute = usePass ? job.passFare : workDays * job.tripFare;
        results.push({
          date: month + '-01',
          amount: wage + commute,
          source: job.name,
          memo: '給与トラッカーより（' + month + ' 分・交通費こみ）',
          sourceKey: 'salary:' + job.id + ':' + month
        });
      });
    });

    actualPayments.forEach(function(p){
      var job = jobs.filter(function(j){ return j.id===p.jobId; })[0];
      results.push({
        date: p.month + '-01',
        amount: (p.taxable||0) + (p.commute||0),
        source: (job ? job.name : '給与') + '（手入力実績）',
        memo: p.note || '',
        sourceKey: 'salaryActual:' + p.jobId + ':' + p.month
      });
    });

    return results;
  }

  function handleSalaryImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.jobs)) throw new Error("invalid");
        var results = importSalaryTracker(data);
        var added = 0, updated = 0;
        results.forEach(function(r){
          var idx = STATE.incomes.findIndex(function(x){ return x.sourceKey && x.sourceKey===r.sourceKey; });
          if (idx >= 0) {
            var changed = STATE.incomes[idx].amount !== r.amount || STATE.incomes[idx].date !== r.date;
            STATE.incomes[idx] = Object.assign({}, STATE.incomes[idx], r);
            if (changed) updated++;
          } else {
            STATE.incomes.push(Object.assign({ id: uid(), createdAt: Date.now() }, r));
            added++;
          }
        });
        renderApp();
        saveState('給与トラッカーから読み込みました（新規' + added + '件・更新' + updated + '件）');
      } catch(e){
        toast('読み込みに失敗しました。給与トラッカーの「バックアップを書き出す」で作ったファイルか確認してください');
      }
    };
    reader.readAsText(file);
  }

        '<div class="budget-pct">' + (budget ? pct + '%' : '（この費目の予算は未設定です）') + '</div></div>';
    });
    if (!anyBudget) out += '<div class="empty">この月のデータや予算設定がまだありません。「予算を設定」からカテゴリごとの上限を決めましょう。</div>';
    out += '</div>';

    out += '<div class="panel"><h3>ステータス内訳（' + monthLabel(month) + '）</h3>';
    var mc = {pending:0,approved:0,returned:0,rejected:0};
    monthExpenses.forEach(function(e){ mc[e.status] = (mc[e.status]||0)+1; });
    ['pending','approved','returned','rejected'].forEach(function(k){
      out += '<div class="status-row"><span class="dot" style="background:var(--' + k + ')"></span>' + STATUS[k].label + '<span class="cnt">' + (mc[k]||0) + ' 件</span></div>';
    });
    out += '<h3 style="margin-top:20px">月次支出の推移</h3>' + monthlyTrendSVG();
    out += '</div></div>';
    return out;
  }

  function monthlyTrendSVG(){
    var byMonth = {};
    STATE.expenses.forEach(function(e){ var k=monthKey(e.date); byMonth[k]=(byMonth[k]||0)+(e.amount||0); });
    var months = Object.keys(byMonth).sort();
    if (!months.length) return '<div class="empty">データなし</div>';
    var maxMonth = Math.max.apply(null, months.map(function(m){return byMonth[m];}).concat([1]));
    var w = 320, h = 140, padL = 6, padB = 22, padT = 8;
    var bw = (w - padL*2) / months.length;
    var barW = Math.min(26, bw*0.55);
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;max-height:160px" role="img" aria-label="月次支出の棒グラフ">';
    svg += '<line x1="' + padL + '" y1="' + (h-padB) + '" x2="' + (w-padL) + '" y2="' + (h-padB) + '" stroke="var(--line)" stroke-width="1"/>';
    months.forEach(function(m, i){
      var val = byMonth[m];
      var bh = Math.max(3, (val/maxMonth) * (h-padT-padB));
      var x = padL + i*bw + (bw-barW)/2;
      var y = (h-padB) - bh;
      svg += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="var(--brand)"><title>' + m + '：' + yen(val) + '</title></rect>';
      svg += '<text x="' + (x+barW/2).toFixed(1) + '" y="' + (h-padB+14) + '" font-size="9.5" text-anchor="middle">' + m.slice(5) + '月</text>';
    });
    svg += '</svg>';
    return svg;
  }

  function kpi(label,val,sub,warn,bad){

  }

    if (STATE.categories.indexOf(v) !== -1) { toast('同じ名前の費目が既にあります'); return; }
    STATE.categories.push(v);
    input.value = '';
    refreshCatRows();
  }

  function deleteCategory(cat){
    if (STATE.categories.length <= 1) { toast('費目は最低1つ必要です'); return; }
    var used = STATE.expenses.filter(function(e){ return e.category===cat; }).length;
    var msg = used > 0
      ? ('「' + cat + '」を使った記録が' + used + '件あります。費目を削除しても過去の記録は残りますが、新規記録では選べなくなります。削除しますか？')
      : ('「' + cat + '」を削除しますか？');
    if (!window.confirm(msg)) return;
    STATE.categories = STATE.categories.filter(function(c){ return c !== cat; });
    delete STATE.budgets[cat];
    refreshCatRows();
  }

  function openBudgetModal(){
    var body = '<h2>費目・予算を管理</h2>' +
      '<div class="modal-desc">費目の追加・削除と、費目ごとの毎月の予算上限を設定します。未設定のままだと、その費目は予算チェックの対象になりません。</div>' +
      '<div class="cat-add-row"><input type="text" id="newCatInput" placeholder="新しい費目名（例：サブスク代）"><button type="button" class="btn-ghost-sm" id="newCatAdd">追加</button></div>' +
      '<div id="catRows">' + catRowsHTML() + '</div>' +
      '<div class="modal-actions"><button class="btn-ghost" id="b-cancel">キャンセル</button><button class="btn-primary" id="b-submit">保存する</button></div>';
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalOverlay').classList.add('show');
    document.getElementById('b-cancel').onclick = closeModal;
    document.getElementById('newCatAdd').onclick = addCategory;
    document.getElementById('newCatInput').addEventListener('keydown', function(ev){
      if (ev.key === 'Enter') { ev.preventDefault(); addCategory(); }
    });
    document.getElementById('catRows').addEventListener('click', function(ev){
      var btn = ev.target.closest('[data-cat-del]');
      if (btn) deleteCategory(btn.getAttribute('data-cat-del'));
    });
    document.getElementById('b-submit').onclick = function(){
      document.querySelectorAll('[data-budget-cat]').forEach(function(inp){
        var cat = inp.getAttribute('data-budget-cat');
        var val = parseFloat(inp.value);
        if (val > 0) STATE.budgets[cat] = val;
        else delete STATE.budgets[cat];
      });
      closeModal();
      renderApp();
      saveState('費目・予算を更新しました');
    };
  }

  function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); document.getElementById('modalBody').innerHTML=''; }

  /* ================= actions ================= */
  function doAction(action){
    var e = byId(ui.selectedId);
    if (!e) return;
    var note = (document.getElementById('reviewNote')||{}).value || '';
    note = note.trim();
    if ((action==='return' || action==='reject') && !note) {
      toast('要注意・却下の理由を入力してください'); return;
    }
    e.status = action==='approve' ? 'approved' : action==='return' ? 'returned' : 'rejected';
    e.reviewComment = note;
    e.reviewedAt = new Date().toISOString().slice(0,10);
    renderApp();
    saveState('ステータスを「' + STATUS[e.status].label + '」に更新しました');
  }

  /* ================= backup: export / import ================= */
  function downloadBlob(content, type, filename){
    var blob = new Blob([content], {type: type});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  function exportBackup(){
    try {
      var ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
      downloadBlob(JSON.stringify(STATE, null, 2), "application/json", "shishutsu-shinsa-backup-" + ts + ".json");
      toast("バックアップファイルをダウンロードしました");
    } catch(e){
      toast("バックアップの作成に失敗しました");
    }
  }

  function csvField(v){
    var s = String(v==null?"":v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  function exportCsv(){
    try {
      var header = ["種別","日付","費目・収入元","金額","内容・メモ","ステータス","審査コメント","審査日"];
      var expenseRows = sorted().map(function(e){
        return ["支出", e.date, e.category, -Math.abs(e.amount), e.memo, STATUS[e.status].label, e.reviewComment, e.reviewedAt||""].map(csvField).join(",");
      });
      var incomeRows = sortedIncomes().map(function(e){
        return ["収入", e.date, e.source, e.amount, e.memo, "", "", ""].map(csvField).join(",");
      });
      var csv = "﻿" + header.join(",") + "\r\n" + expenseRows.concat(incomeRows).join("\r\n");
      var ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
      downloadBlob(csv, "text/csv;charset=utf-8", "shishutsu-kiroku-" + ts + ".csv");
      toast("CSVファイルをダウンロードしました（収入・支出）");
    } catch(e){
      toast("CSVの作成に失敗しました");
    }
  }

  function importBackup(file){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.expenses)) throw new Error("invalid");
        var ok = window.confirm("バックアップを読み込むと、現在のデータは上書きされます。よろしいですか？");
        if (!ok) return;
        STATE = data;
        if (!STATE.budgets) STATE.budgets = {};
        if (!STATE.categories || !STATE.categories.length) STATE.categories = DEFAULT_CATEGORIES.slice();
        if (!STATE.incomes) STATE.incomes = [];
        ui.selectedId = null;
        renderApp();
        saveState("バックアップから復元しました（" + STATE.expenses.length + " 件）");
      } catch(e){
        toast("読み込みに失敗しました。正しいバックアップファイルか確認してください");
      }
    };
    reader.readAsText(file);
  }

  /* ================= events ================= */
  function bindEvents(){
    document.querySelectorAll('[data-nav]').forEach(function(b){
      b.onclick = function(){ ui.view = b.getAttribute('data-nav'); renderApp(); };
    });
    document.querySelectorAll('[data-filter]').forEach(function(b){
      b.onclick = function(){ ui.filter = b.getAttribute('data-filter'); renderApp(); };
    });
    document.querySelectorAll('[data-select]').forEach(function(b){
      b.onclick = function(){ ui.selectedId = b.getAttribute('data-select'); renderApp(); };
    });
    document.querySelectorAll('[data-action]').forEach(function(b){
      b.onclick = function(){ doAction(b.getAttribute('data-action')); };
    });
    var zoomImg = document.querySelector('[data-zoom]');
    if (zoomImg) zoomImg.onclick = function(){
      document.getElementById('lightboxImg').src = zoomImg.src;
      document.getElementById('lightbox').classList.add('show');
    };
    var btnNew = document.getElementById('btnNew');
    if (btnNew) btnNew.onclick = openNewModal;
    var btnBudget = document.getElementById('btnBudget');
    if (btnBudget) btnBudget.onclick = openBudgetModal;
    var btnCsv = document.getElementById('btnCsv');
    if (btnCsv) btnCsv.onclick = exportCsv;
    var btnExport = document.getElementById('btnExport');
    if (btnExport) btnExport.onclick = exportBackup;
    var btnImport = document.getElementById('btnImport');
    if (btnImport) btnImport.onclick = function(){ document.getElementById('restoreFile').click(); };
    var dashMonthSel = document.getElementById('dashMonthSel');
    if (dashMonthSel) dashMonthSel.onchange = function(){ ui.dashMonth = dashMonthSel.value; renderApp(); };
    var btnNewIncome = document.getElementById('btnNewIncome');
    if (btnNewIncome) btnNewIncome.onclick = openIncomeModal;
    var btnSalaryImport = document.getElementById('btnSalaryImport');
    if (btnSalaryImport) btnSalaryImport.onclick = function(){ document.getElementById('salaryImportFile').click(); };
    document.querySelectorAll('[data-income-del]').forEach(function(b){
      b.onclick = function(){ deleteIncome(b.getAttribute('data-income-del')); };
    });
  }
  document.getElementById('modalOverlay').addEventListener('click', function(ev){
    if (ev.target.id === 'modalOverlay') closeModal();
  });
  document.getElementById('lightbox').addEventListener('click', function(){
    document.getElementById('lightbox').classList.remove('show');
  });
  document.getElementById('restoreFile').addEventListener('change', function(ev){
    var file = ev.target.files[0];
    if (file) importBackup(file);
    ev.target.value = "";
  });
  document.getElementById('salaryImportFile').addEventListener('change', function(ev){
    var file = ev.target.files[0];
    if (file) handleSalaryImportFile(file);
    ev.target.value = "";
  });

  /* ================= persistence (localStorage) ================= */
  function saveState(msg){
    if (msg) toast(msg);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 400);
  }

  function doSave(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      lastSavedAt = new Date();
      var badge = document.getElementById('saveBadge');
      if (badge) badge.innerHTML = saveBadgeText();
    } catch(e){
      toast("保存容量の上限に達した可能性があります。バックアップを保存してください");
    }
  }

  /* ================= init ================= */
  renderApp();
})();
</script>
</body>
</html>
