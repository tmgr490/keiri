<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支出審査デスク</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ink:#202b36;
    --ink-soft:#586270;
    --ink-faint:#8992a0;
    --paper:#f3efe3;
    --paper-raised:#faf7ee;
    --surface:#fffdf8;
    --line:#e0d8c2;
    --line-strong:#cdc3a6;
    --brand:#1f6b73;
    --brand-ink:#0f4a51;
    --brand-soft:#e2eeee;
    --pending:#6b7280;
    --pending-soft:#eceeef;
    --approved:#2f8a5b;
    --approved-soft:#e3f2e9;
    --returned:#b9791c;
    --returned-soft:#faedd8;
    --rejected:#b23d2c;
    --rejected-soft:#fbe4df;
    --board:#d9d2bd;
    --clip:#96897a;
    --clip-dark:#726657;
    --shadow: 0 1px 2px rgba(32,43,54,.06), 0 8px 24px -12px rgba(32,43,54,.25);
    --radius: 8px;
  }
  /* ダークモードは使わず、時間帯や端末の設定に関わらず常にこの明るい配色で表示する */
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--brand-soft);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .app{max-width:1280px;margin:0 auto;padding:20px 20px 60px;}

  /* ---------- title bar ---------- */
  .titlebar{
    display:flex;align-items:center;gap:12px;
    padding:4px 6px 14px;margin-bottom:2px;
  }
  .hanko{
    width:34px;height:34px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 35% 30%, var(--rejected) 0%, var(--rejected) 55%, transparent 56%);
    border:2px solid var(--rejected);
    display:flex;align-items:center;justify-content:center;
    color:var(--rejected);font-family:"Shippori Mincho",serif;font-weight:700;font-size:12px;
    opacity:.9;transform:rotate(-6deg);
  }
  .titlebar h1{
    font-family:"Shippori Mincho",serif;font-weight:700;font-size:18px;margin:0;letter-spacing:.03em;
  }
  .titlebar .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .savebadge{margin-left:auto;font-size:11px;color:var(--ink-faint);white-space:nowrap;}
  .savebadge b{color:var(--ink-soft);}
  .titlebar .dots{display:flex;gap:6px;margin-left:14px;}
  .titlebar .dots span{width:9px;height:9px;border-radius:50%;display:block;}
  .dot-a{background:var(--rejected);} .dot-b{background:var(--returned);} .dot-c{background:var(--approved);}

  /* ---------- nav：フォルダのタブ ---------- */
  .nav{display:flex;gap:5px;margin-bottom:0;flex-wrap:wrap;align-items:flex-end;padding:0 2px;position:relative;z-index:3;}
  .navbtn{
    border:1px solid var(--line-strong);border-bottom:none;background:var(--board);color:var(--ink-soft);
    padding:9px 18px 10px;border-radius:9px 9px 0 0;font-size:13px;font-weight:700;cursor:pointer;
    font-family:"Shippori Mincho",serif;letter-spacing:.02em;
    display:flex;align-items:center;gap:6px;position:relative;filter:brightness(0.96);
  }
  .navbtn.active{background:var(--paper);color:var(--ink);filter:none;box-shadow:0 -2px 6px rgba(32,43,54,.05);}
  .navbtn:hover:not(.active){filter:brightness(1.04);}
  .spacer{flex:1;}
  .nav .btn-primary,.nav .btn-ghost-sm{margin-bottom:6px;}
  .btn-primary{
    border:1px solid var(--brand);background:var(--brand);color:#fff;
    padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .btn-primary:hover{background:var(--brand-ink);border-color:var(--brand-ink);}
  .btn-ghost-sm{
    border:1px solid var(--line-strong);background:var(--paper-raised);color:var(--ink-soft);
    padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .btn-ghost-sm:hover{border-color:var(--ink-faint);}

  /* ---------- board：クリップボードに留めた紙 ---------- */
  .board{
    position:relative;
    background:var(--paper);
    border:1px solid var(--line-strong);
    border-radius:0 14px 14px 14px;
    box-shadow:0 18px 34px -14px rgba(32,43,54,.28), 0 2px 0 rgba(32,43,54,.05);
    padding:34px 30px 30px;
    margin-top:-1px;
  }
  .board::before{
    content:"";position:absolute;top:-19px;left:50%;transform:translateX(-50%);
    width:96px;height:28px;border-radius:6px;
    background:linear-gradient(180deg,var(--clip),var(--clip-dark));
    box-shadow:0 4px 10px rgba(32,43,54,.28);
  }
  .board::after{
    content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);
    width:52px;height:13px;background:var(--paper);border:1px solid var(--line-strong);border-radius:3px;
  }

  /* ---------- review layout ---------- */
  .review{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start;}
  @media (max-width: 860px){ .review{grid-template-columns:1fr;} }

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .chip{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:5px;
  }
  .chip .n{font-variant-numeric:tabular-nums;opacity:.75;}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .list{display:flex;flex-direction:column;gap:8px;max-height:74vh;overflow-y:auto;padding-right:2px;}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);
  }
  .card:hover{border-color:var(--line-strong);}
  .card.selected{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft);}
  .card-row{display:flex;align-items:flex-start;gap:8px;}
  .row-check{margin-top:3px;flex-shrink:0;cursor:pointer;width:16px;height:16px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-name{font-weight:700;font-size:14px;}
  .card-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .bulk-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--brand-soft);border:1px solid var(--brand);border-radius:var(--radius);padding:8px 12px;margin-bottom:8px;font-size:13px;}
  .bulk-bar .spacer{flex:1;}
  .card-amount{font-weight:900;font-size:15.5px;white-space:nowrap;}
  .card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .pill{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;
  }
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;display:block;}
  .pill.st-pending{background:var(--pending-soft);color:var(--pending);}
  .pill.st-pending::before{background:var(--pending);}
  .pill.st-approved{background:var(--approved-soft);color:var(--approved);}
  .pill.st-approved::before{background:var(--approved);}
  .pill.st-returned{background:var(--returned-soft);color:var(--returned);}
  .pill.st-returned::before{background:var(--returned);}
  .pill.st-rejected{background:var(--rejected-soft);color:var(--rejected);}
  .pill.st-rejected::before{background:var(--rejected);}
  .flag{font-size:10.5px;color:var(--rejected);font-weight:700;}

  .empty{
    background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);
    padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;
  }

  /* ---------- detail panel ---------- */
  .detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;min-height:74vh;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px;}
  .detail-title{font-family:"Shippori Mincho",serif;font-size:19px;font-weight:700;}
  .detail-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .detail-amount{font-size:26px;font-weight:900;letter-spacing:-.01em;}
  .budget-ctx{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:10px 14px;
    font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;
  }
  .budget-ctx b{color:var(--ink);}
  .budget-ctx .mini-track{background:var(--line);border-radius:4px;height:6px;margin-top:6px;overflow:hidden;}
  .budget-ctx .mini-fill{height:100%;border-radius:4px;}
  .memo{background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:16px;white-space:pre-wrap;}
  .receipt-box{margin-bottom:18px;}
  .receipt-box img{max-width:100%;max-height:280px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block;}
  .receipt-none{font-size:12.5px;color:var(--rejected);background:var(--rejected-soft);border-radius:8px;padding:10px 14px;display:inline-block;}
  .history{font-size:12.5px;color:var(--ink-soft);background:var(--paper-raised);border-left:3px solid var(--line-strong);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:16px;}
  .actions{border-top:1px solid var(--line);padding-top:16px;}
  .actions label{font-size:11px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em;display:block;margin-bottom:6px;}
  textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;
    background:var(--paper-raised);color:var(--ink);resize:vertical;min-height:56px;margin-bottom:12px;
  }
  .act-row{display:flex;gap:8px;flex-wrap:wrap;}
  .act-btn{
    border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid transparent;
  }
  .act-approve{background:var(--approved);color:#fff;}
  .act-approve:hover{filter:brightness(0.92);}
  .act-return{background:var(--returned-soft);color:var(--returned);border-color:var(--returned);}
  .act-return:hover{background:var(--returned);color:#fff;}
  .act-reject{background:var(--rejected-soft);color:var(--rejected);border-color:var(--rejected);}
  .act-reject:hover{background:var(--rejected);color:#fff;}
  .placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-faint);font-size:13.5px;min-height:60vh;}

  /* ---------- dashboard ---------- */
  .dash-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .dash-toolbar label{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .dash-toolbar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--surface);color:var(--ink);}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  @media (max-width: 860px){ .kpis{grid-template-columns:repeat(2,1fr);} }
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .kpi .lbl{font-size:11.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em;margin-bottom:6px;}
  .kpi .val{font-size:24px;font-weight:900;}
  .kpi .sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .kpi.warn .val{color:var(--returned);}
  .kpi.bad .val{color:var(--rejected);}
  .panels{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  @media (max-width: 860px){ .panels{grid-template-columns:1fr;} }
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
  .panel h3{font-family:"Shippori Mincho",serif;font-size:15.5px;margin:0 0 14px;font-weight:700;}
  .budget-row{margin-bottom:14px;}
  .budget-row-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .budget-row-top .cat{font-weight:700;color:var(--ink);}
  .budget-row-top .amt{color:var(--ink-soft);}
  .budget-row-top .amt b{color:var(--ink);font-weight:700;}
  .budget-track{background:var(--paper-raised);border-radius:4px;height:14px;position:relative;overflow:hidden;}
  .budget-fill{height:100%;border-radius:4px;}
  .budget-pct{font-size:11px;color:var(--ink-faint);margin-top:3px;}
  .status-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
  .status-row .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .status-row .cnt{margin-left:auto;font-weight:800;}
  svg text{font-family:"Zen Kaku Gothic New",sans-serif;fill:var(--ink-soft);}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,22,18,.5);display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--surface);border-radius:14px;border:1px solid var(--line);max-width:560px;width:100%;
    max-height:88vh;overflow-y:auto;padding:24px 26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
  }
  .modal h2{font-family:"Shippori Mincho",serif;font-size:19px;margin:0 0 6px;}
  .modal .modal-desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .form-row{margin-bottom:13px;}
  .form-row label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .form-row input[type=text],.form-row input[type=date],.form-row input[type=number],.form-row select,.form-row textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;background:var(--paper-raised);color:var(--ink);
  }
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .file-drop{border:1.5px dashed var(--line-strong);border-radius:8px;padding:16px;text-align:center;font-size:12.5px;color:var(--ink-soft);cursor:pointer;background:var(--paper-raised);}
  .file-drop img{max-height:120px;border-radius:6px;margin-top:8px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .btn-ghost{border:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .budget-form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .budget-form-row .cat{width:120px;flex:none;font-size:13px;font-weight:700;}
  .budget-form-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;background:var(--paper-raised);color:var(--ink);}
  .budget-form-row .yen{color:var(--ink-faint);font-size:12.5px;}
  .cat-del{
    flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-faint);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .cat-del:hover{background:var(--rejected-soft);color:var(--rejected);border-color:var(--rejected);}
  .btn-delete-row{
    width:100%;border:1px solid var(--line-strong);background:var(--paper-raised);color:var(--ink-faint);
    padding:9px 0;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .btn-delete-row:hover{background:var(--rejected-soft);color:var(--rejected);border-color:var(--rejected);}
  .cat-add-row{display:flex;gap:8px;margin-bottom:16px;}
  .cat-add-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;background:var(--paper-raised);color:var(--ink);}

  .lightbox{position:fixed;inset:0;background:rgba(10,10,8,.86);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out;padding:30px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:6px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:20px;font-size:12.5px;font-weight:700;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:70;
    max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<div class="app" id="app"></div>

<div class="overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt="領収書拡大"></div>
<div class="toast" id="toast"></div>

<input type="file" id="restoreFile" accept="application/json" style="display:none">
<input type="file" id="salaryImportFile" accept="application/json" style="display:none">
<input type="file" id="kakeiboImportFile" accept="application/json" style="display:none">
<input type="file" id="payslipImportFile" accept="application/pdf" multiple style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = "keihiShinsaState.v1";

  /* ================= constants ================= */
  var DEFAULT_CATEGORIES = ["食費","交際費","娯楽費","交通費","日用品","通信費","書籍・学用品","衣服・美容","医療費","その他"];
  var STATUS = {
    pending:  {label:"未審査",     cls:"st-pending"},
    approved: {label:"承認",       cls:"st-approved"},
    rejected: {label:"無駄遣い認定", cls:"st-rejected"}
  };

  /* ================= state ================= */
  var STATE = { expenses: [], budgets: {} };
  var lastSavedAt = null;
  var saveFailed = false;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) STATE = JSON.parse(raw);
  } catch(e){ STATE = { expenses: [], budgets: {} }; }
  if (!STATE.expenses) STATE.expenses = [];
  if (!STATE.budgets) STATE.budgets = {};
  if (!STATE.categories || !STATE.categories.length) STATE.categories = DEFAULT_CATEGORIES.slice();
  if (!STATE.incomes) STATE.incomes = [];

  var ui = { view: "review", filter: "all", selectedId: null, dashMonth: new Date().toISOString().slice(0,7), checked: [] };
  var saveTimer = null;

  /* ================= helpers ================= */
  function uid(){ return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function yen(n){ return "¥" + Math.round(n||0).toLocaleString("ja-JP"); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmtDate(d){ if(!d) return "—"; var p=d.split("-"); return p.length===3 ? p[0]+"/"+p[1]+"/"+p[2] : d; }
  function fmtTime(d){ if(!d) return ""; var h=String(d.getHours()).padStart(2,"0"),m=String(d.getMinutes()).padStart(2,"0"),s=String(d.getSeconds()).padStart(2,"0"); return h+":"+m+":"+s; }
  function monthKey(d){ return d ? d.slice(0,7) : "不明"; }
  function monthLabel(m){ var p=m.split("-"); return p.length===2 ? p[0]+"年"+parseInt(p[1],10)+"月" : m; }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }
  function pctColorVar(pct){
    if (pct >= 100) return "rejected";
    if (pct >= 80) return "returned";
    return "brand";
  }

  function byId(id){ return STATE.expenses.find(function(e){ return e.id===id; }); }
  function sorted(){ return STATE.expenses.slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||"") || b.createdAt-a.createdAt; }); }
  function incomeById(id){ return STATE.incomes.find(function(e){ return e.id===id; }); }
  function sortedIncomes(){ return STATE.incomes.slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||"") || b.createdAt-a.createdAt; }); }
  function incomeInMonth(month){ return STATE.incomes.filter(function(e){ return monthKey(e.date)===month; }).reduce(function(s,e){ return s+(e.amount||0); },0); }
  function counts(){
    var c = {all: STATE.expenses.length, pending:0, approved:0, rejected:0};
    STATE.expenses.forEach(function(e){ c[e.status] = (c[e.status]||0)+1; });
    return c;
  }
  function spentInMonth(cat, month){
    return STATE.expenses.filter(function(e){ return e.category===cat && monthKey(e.date)===month; })
      .reduce(function(s,e){ return s+(e.amount||0); },0);
  }
  function availableMonths(){
    var set = {};
    STATE.expenses.forEach(function(e){ set[monthKey(e.date)] = true; });
    set[ui.dashMonth] = true;
    set[new Date().toISOString().slice(0,7)] = true;

  /* ================= 給与明細PDFの読み込み ================= */
  // PDFの座標情報から行を組み立て（同じ行＝y座標が近いもの）、x座標順に並べて連結した「行テキスト」にする。
  // トークンの区切り方（文字単位／単語単位）はPDF生成元やブラウザのpdf.js実装によってまちまちなので、
  // 区切りには依存せず、行全体を連結してからラベル文字列をindexOfで探す方式にして読み取り精度を上げている。
  function extractPdfRows(items){
    var rows = [];
    items.forEach(function(it){
      var x = it.transform[4], y = it.transform[5];
      var row = rows.filter(function(r){ return Math.abs(r.y - y) < 3; })[0];
      if (!row) { row = { y: y, items: [] }; rows.push(row); }
      row.items.push({ x: x, str: it.str });
    });
    rows.sort(function(a,b){ return b.y - a.y; });
    return rows.map(function(row){
      row.items.sort(function(a,b){ return a.x - b.x; });
      return row.items.map(function(it){ return it.str; }).join('');
    });
  }

  var PAYSLIP_NUM_RE = /^[\d,，]+/;
  function payslipToNum(s){ return parseInt(String(s).replace(/[,，]/g,''), 10); }

  // まいばすけっと（コンビニ勤怠システム）形式の給与明細レイアウトに合わせたラベル抽出
  var PAYSLIP_AMOUNT_LABELS = [
    '出勤日数（日）','欠勤日数（日）','契約時間（時間）','実働時間（分）',
    '所定内労働時間（分）','所定内支給金額',
    '（基本給）','（資格給）','（部門給）','（地域給）','（能力給）','（職位給）',
    '（スキル給）','（調整給Ａ）','（調整給Ｂ）','（調整給Ｃ）','（調整給Ｓ）',
    '（時間帯加給Ａ）','（時間帯加給Ｂ）','（時間帯加給Ｃ）','（時間帯加給Ｄ）',
    '（時間帯加給Ｅ）','（時間帯加給Ｆ）','（時間帯加給Ｇ）','（曜日加給）',
    '通勤手当','支給合計','控除合計','差引支給額','本年累計課税対象額'
  ];
  var PAYSLIP_TEXT_LABELS = ['所属','振込口座'];

  function payslipExtractNumberAfter(rowText, label){
    var idx = rowText.indexOf(label);
    if (idx < 0) return null;
    var rest = rowText.slice(idx + label.length);
    var m = rest.match(PAYSLIP_NUM_RE);
    if (!m) return null;
    return payslipToNum(m[0]);
  }

  function parsePayslipRows(rows){
    var result = { amounts: {}, meta: {} };
    rows.forEach(function(rowText){
      var ymMatch = rowText.match(/(\d{4}年\d{1,2}月度)/);
      if (ymMatch && !result.meta.yearMonth) result.meta.yearMonth = ymMatch[1];

      var periodMatch = rowText.match(/就業状況.*?(\d{1,2}\/\d{1,2})\s*-\s*(\d{1,2}\/\d{1,2})/);
      if (periodMatch) result.meta.period = periodMatch[1] + ' - ' + periodMatch[2];

      PAYSLIP_AMOUNT_LABELS.forEach(function(label){
        var v = payslipExtractNumberAfter(rowText, label);
        if (v != null) result.amounts[label] = v;
      });

      PAYSLIP_TEXT_LABELS.forEach(function(label){
        var idx = rowText.indexOf(label);
        if (idx < 0) return;
        var rest = rowText.slice(idx + label.length);
        var cut = rest.search(/[\s　]/);
        var val = (cut >= 0 ? rest.slice(0, cut) : rest).trim();
        if (!val) return;
        if (label === '所属' && !result.meta.company) result.meta.company = val;
        if (label === '振込口座' && !result.meta.bankAccount) result.meta.bankAccount = val;
      });
    });
    return result;
  }

  var PAYSLIP_ALLOWANCE_KEYS = [
    '（資格給）','（部門給）','（地域給）','（能力給）','（職位給）','（スキル給）',
    '（調整給Ａ）','（調整給Ｂ）','（調整給Ｃ）','（調整給Ｓ）',
    '（時間帯加給Ａ）','（時間帯加給Ｂ）','（時間帯加給Ｃ）','（時間帯加給Ｄ）',
    '（時間帯加給Ｅ）','（時間帯加給Ｆ）','（時間帯加給Ｇ）','（曜日加給）'
  ];

  function payslipSourceKey(parsed){
    var m = parsed.meta || {};
    var ym = m.yearMonth || m.period || '';
    return 'payslip:' + (m.company || '') + ':' + ym;
  }

  function parsePayslipFile(file){
    return new Promise(function(resolve, reject){
      if (pdfjsLib.GlobalWorkerOptions && !pdfjsLib.GlobalWorkerOptions.workerSrc) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      var reader = new FileReader();
      reader.onload = function(){
        var data = new Uint8Array(reader.result);
        pdfjsLib.getDocument({ data: data }).promise
          .then(function(pdf){ return pdf.getPage(1); })
          .then(function(page){ return page.getTextContent(); })
          .then(function(textContent){
            var rows = extractPdfRows(textContent.items);
            var parsed = parsePayslipRows(rows);
            if (parsed.amounts['差引支給額'] == null) { reject({file:file, reason:'parse'}); return; }
            parsed.fileName = file.name;
            resolve(parsed);
          })
          .catch(function(){ reject({file:file, reason:'read'}); });
      };
      reader.onerror = function(){ reject({file:file, reason:'read'}); };
      reader.readAsArrayBuffer(file);
    });
  }

  function handlePayslipImportFiles(fileList){
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    if (typeof pdfjsLib === 'undefined') {
      toast('PDF読み取り機能を読み込めませんでした。インターネット接続を確認してください');
      return;
    }
    if (files.length > 1) toast(files.length + '件のPDFを読み込み中…');
    var results = [];
    var chain = Promise.resolve();
    files.forEach(function(file){
      chain = chain.then(function(){
        return parsePayslipFile(file).then(function(parsed){
          results.push({ ok:true, parsed:parsed });
        }).catch(function(err){
          results.push({ ok:false, file:file });
        });
      });
    });
    chain.then(function(){
      var okList = results.filter(function(r){ return r.ok; }).map(function(r){ return r.parsed; });
      var failList = results.filter(function(r){ return !r.ok; });
      if (failList.length) {
        toast('読み取りに失敗しました：' + failList.map(function(r){ return r.file.name; }).join('、') + '（対応していない形式の可能性があります）');
      }
      if (!okList.length) return;
      openPayslipQueue(okList, 0);
    });
  }

    var breakdownHTML = '<table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px">' +

      : '';

    var body = progressHTML +
      '<h2>給与明細の読み取り結果</h2>' +
      '<div class="modal-desc">' + esc(m.yearMonth || '給与明細') + (m.company ? '　' + esc(m.company) : '') + '　（内容を確認・修正してから記録してください）</div>' +
      dupHTML +
      breakdownHTML +
      '<div class="form-2col">' +
      '<div class="form-row"><label>受取日</label><input type="date" id="ps-date" value="' + defaultDate + '"></div>' +
      '<div class="form-row"><label>収入元</label><input type="text" id="ps-source" value="' + esc(defaultSource) + '"></div>' +
      '</div>' +
      '<div class="form-row"><label>金額（円）・差引支給額</label><input type="number" id="ps-amount" min="0" step="1" value="' + (net||'') + '"></div>' +
      '<div class="form-row"><label>メモ（任意）</label><textarea id="ps-memo" rows="2">' + esc(m.period ? '給与明細より（' + m.period + '）' : '給与明細より') + '</textarea></div>' +
      '<div class="modal-actions">' +

  /* ================= salary tracker import ================= */
  /* 読み込み時点で「実際に支給されている」給与だけを取り込む。
     バイトごとの締め日・支払日（土日祝の前後調整込み）から支払日を計算し、
     支払日が読み込み時点（今日）を過ぎているサイクルだけを収入として取り込む。 */
  function importSalaryTracker(data){
    var jobs = data.jobs || [];
    var shifts = data.shifts || [];
    var actualPayments = data.actualPayments || [];
    var holidays = data.holidays || {};

    function parseYMD(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
    function pad2(n){ return n<10 ? '0'+n : ''+n; }
    function toKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
    function isSunday(d){ return d.getDay()===0; }
    function isHoliday(k){ return !!holidays[k]; }
    function dayType(k){ var d=parseYMD(k); return (isSunday(d)||isHoliday(k)) ? 'holiday' : 'weekday'; }
    function timeToHours(t){ var p=t.split(':').map(Number); return p[0]+p[1]/60; }
    // day=0 は「月末」を意味する
    function dayOfMonthClamped(y, mIdx, day){
      if (day===0) return new Date(y, mIdx+1, 0);
      var dim = new Date(y, mIdx+1, 0).getDate();
      return new Date(y, mIdx, Math.min(day, dim));
    }
    function jobDefaults(job){
      return {
        cutoffDay: job.cutoffDay===undefined ? 20 : job.cutoffDay,
        paymentMonthsAfter: job.paymentMonthsAfter===undefined ? 1 : job.paymentMonthsAfter,
        paymentDay: job.paymentDay===undefined ? 5 : job.paymentDay,
        holidayAdjustment: job.holidayAdjustment===undefined ? 'before' : job.holidayAdjustment
      };
    }
    // 給与サイクルキー = 締め日が属する月（'YYYY-MM'）
    function cycleKeyForDate(d, cfg){
      var y = d.getFullYear(), m = d.getMonth();
      var cutoff = dayOfMonthClamped(y, m, cfg.cutoffDay);
      if (d <= cutoff) return y+'-'+pad2(m+1);
      var next = new Date(y, m+1, 1);
      return next.getFullYear()+'-'+pad2(next.getMonth()+1);
    }
    // そのサイクルの実際の支払日（土日祝は前後にずらす）
    function cyclePaymentDate(key, cfg){
      var parts = key.split('-').map(Number);
      var mIdx = parts[1]-1;
      var payMonth = new Date(parts[0], mIdx + (cfg.paymentMonthsAfter||0), 1);
      var payDate = dayOfMonthClamped(payMonth.getFullYear(), payMonth.getMonth(), cfg.paymentDay);
      if (cfg.holidayAdjustment !== 'none'){
        var dir = cfg.holidayAdjustment==='after' ? 1 : -1;
        while (isSunday(payDate) || payDate.getDay()===6 || isHoliday(toKey(payDate))){
          payDate = new Date(payDate.getFullYear(), payDate.getMonth(), payDate.getDate()+dir);
        }
      }
      return payDate;
    }
    function rateForHour(hour, type, job){
      var band = job.wageBands.filter(function(b){ var bs=timeToHours(b.start), be=timeToHours(b.end); return hour>=bs && hour<be; })[0];
      var rate = job.baseWage + (band ? (Number(band.addon)||0) : 0);
      return type==='holiday' ? rate + job.sunAdd : rate;
    }
    function bandBoundariesInRange(start,end,job){
      var points = {};
      job.wageBands.forEach(function(b){
        var bs=timeToHours(b.start), be=timeToHours(b.end);
        if (bs>start && bs<end) points[bs]=true;
        if (be>start && be<end) points[be]=true;
      });
      return Object.keys(points).map(Number);
    }
    function calcShiftWage(shift, job){
      var type = dayType(shift.date);
      var start = timeToHours(shift.start), end = timeToHours(shift.end);
      if (end<=start) end += 24;
      var breakHours = (shift.breakMin||0)/60;
      var points = [start].concat(bandBoundariesInRange(start,end,job)).concat([end]);
      points = Array.from(new Set(points)).sort(function(a,b){return a-b;});
      var totalPay=0, totalHours=0;
      for (var i=0;i<points.length-1;i++){
        var segStart=points[i], segEnd=points[i+1];
        var dur = segEnd-segStart;
        var rate = rateForHour(segStart % 24, type, job);
        totalPay += rate*dur; totalHours += dur;
      }
      if (breakHours>0 && totalHours>0){
        var avgRate = totalPay/totalHours;
        totalPay -= avgRate*breakHours; totalHours -= breakHours;
      }
      return Math.round(totalPay);
    }

    var results = [];
    var today = new Date(); today.setHours(0,0,0,0);

    jobs.forEach(function(job){
      var cfg = jobDefaults(job);
      var jobShifts = shifts.filter(function(s){ return s.jobId===job.id; });
      var byCycle = {};
      jobShifts.forEach(function(s){
        var key = cycleKeyForDate(parseYMD(s.date), cfg);
        if (!byCycle[key]) byCycle[key] = [];
        byCycle[key].push(s);
      });
      Object.keys(byCycle).forEach(function(cycleKey){
        var payDate = cyclePaymentDate(cycleKey, cfg);
        if (payDate > today) return; // まだ支給日が来ていないサイクルは取り込まない
        var group = byCycle[cycleKey];
        var workDays = Array.from(new Set(group.map(function(s){ return s.date; }))).length;
        var wage = group.reduce(function(sum,s){ return sum + calcShiftWage(s, job); }, 0);
        var usePass = workDays >= job.passThreshold;
        var commute = usePass ? job.passFare : workDays * job.tripFare;
        results.push({
          date: toKey(payDate),
          amount: wage + commute,
          source: job.name,
          memo: '給与トラッカーより（' + cycleKey + ' 締め分・交通費こみ・支払日 ' + toKey(payDate) + '）',
          sourceKey: 'salary:' + job.id + ':' + cycleKey
        });
      });
    });

    actualPayments.forEach(function(p){
      var job = jobs.filter(function(j){ return j.id===p.jobId; })[0];
      results.push({
        date: p.month + '-01',
        amount: (p.taxable||0) + (p.commute||0),
        source: (job ? job.name : '給与') + '（手入力実績）',
        memo: p.note || '',
        sourceKey: 'salaryActual:' + p.jobId + ':' + p.month
      });
    });

    return results;
  }

  function handleSalaryImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.jobs)) throw new Error("invalid");
        var results = importSalaryTracker(data);
        var added = 0, updated = 0;
        results.forEach(function(r){
          var idx = STATE.incomes.findIndex(function(x){ return x.sourceKey && x.sourceKey===r.sourceKey; });
          if (idx >= 0) {
            var changed = STATE.incomes[idx].amount !== r.amount || STATE.incomes[idx].date !== r.date;
            STATE.incomes[idx] = Object.assign({}, STATE.incomes[idx], r);
            if (changed) updated++;
          } else {
            STATE.incomes.push(Object.assign({ id: uid(), createdAt: Date.now() }, r));
            added++;
          }
        });
        renderApp();
        saveState('給与トラッカーから読み込みました（新規' + added + '件・更新' + updated + '件）');
      } catch(e){
        toast('読み込みに失敗しました。給与トラッカーの「バックアップを書き出す」で作ったファイルか確認してください');
      }
    };
    reader.readAsText(file);
  }

  function categoryPieSVG(month){
    var monthExpenses = STATE.expenses.filter(function(e){ return monthKey(e.date)===month; });
    var totals = {};
    var total = 0;
    monthExpenses.forEach(function(e){
      var amt = e.amount || 0;
      if (amt <= 0) return;
      totals[e.category] = (totals[e.category] || 0) + amt;
      total += amt;
    });
    var cats = Object.keys(totals).sort(function(a,b){ return totals[b]-totals[a]; });
    if (!cats.length || total <= 0) return '<div class="empty">この月の支出データがありません。</div>';

    var w = 340, h = 280, cx = 130, cy = 140, r = 82, labelR = r + 40;
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;max-height:300px" role="img" aria-label="用途別の利用状況の円グラフ">';
    var angle = -Math.PI / 2; // 12時位置から時計回りに開始

    cats.forEach(function(cat, i){
      var amt = totals[cat];
      var frac = amt / total;
      var sweep = frac * Math.PI * 2;
      var a0 = angle, a1 = angle + sweep;
      var x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
      var x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
      var large = sweep > Math.PI ? 1 : 0;
      var hue = Math.round((i * 47) % 360);
      var color = 'hsl(' + hue + ',55%,50%)';
      var pct = Math.round(frac*100);

      svg += '<path d="M' + cx + ',' + cy + ' L' + x0.toFixed(1) + ',' + y0.toFixed(1) +
        ' A' + r + ',' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' Z" ' +
        'fill="' + color + '" stroke="var(--surface)" stroke-width="1.5">' +
        '<title>' + esc(cat) + '：' + yen(amt) + '（' + pct + '%）</title></path>';

      var mid = (a0 + a1) / 2;
      if (pct >= 8) {
        // スライス内に費目名と割合を直接埋め込む
        var ix = cx + r*0.6*Math.cos(mid), iy = cy + r*0.6*Math.sin(mid);
        svg += '<text x="' + ix.toFixed(1) + '" y="' + (iy-3).toFixed(1) + '" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff">' + esc(cat.length>7 ? cat.slice(0,7)+'…' : cat) + '</text>';
        svg += '<text x="' + ix.toFixed(1) + '" y="' + (iy+10).toFixed(1) + '" font-size="9.5" text-anchor="middle" fill="#fff">' + pct + '%</text>';
      } else if (pct >= 3) {
        // 小さいスライスは引き出し線でグラフの外周に注記する
        var lx1 = cx + (r-4)*Math.cos(mid), ly1 = cy + (r-4)*Math.sin(mid);
        var lx2 = cx + labelR*Math.cos(mid), ly2 = cy + labelR*Math.sin(mid);
        var anchor = Math.cos(mid) > 0.2 ? 'start' : (Math.cos(mid) < -0.2 ? 'end' : 'middle');
        svg += '<line x1="' + lx1.toFixed(1) + '" y1="' + ly1.toFixed(1) + '" x2="' + lx2.toFixed(1) + '" y2="' + ly2.toFixed(1) + '" stroke="var(--ink-soft)" stroke-width="1"/>';
        svg += '<text x="' + lx2.toFixed(1) + '" y="' + (ly2-2).toFixed(1) + '" font-size="9.5" text-anchor="' + anchor + '" fill="var(--ink)">' + esc(cat) + '</text>';
        svg += '<text x="' + lx2.toFixed(1) + '" y="' + (ly2+10).toFixed(1) + '" font-size="9" text-anchor="' + anchor + '" fill="var(--ink-soft)">' + pct + '%</text>';
      }
      angle = a1;
    });

    svg += '</svg>';
    return svg;
  }

  function monthlyTrendSVG(){
    var byMonth = {};
    STATE.expenses.forEach(function(e){ var k=monthKey(e.date); byMonth[k]=(byMonth[k]||0)+(e.amount||0); });
    var months = Object.keys(byMonth).sort();
    if (!months.length) return '<div class="empty">データなし</div>';
    var maxMonth = Math.max.apply(null, months.map(function(m){return byMonth[m];}).concat([1]));
    var w = 320, h = 140, padL = 6, padB = 22, padT = 8;
    var bw = (w - padL*2) / months.length;
    var barW = Math.min(26, bw*0.55);
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;max-height:160px" role="img" aria-label="月次支出の棒グラフ">';
    svg += '<line x1="' + padL + '" y1="' + (h-padB) + '" x2="' + (w-padL) + '" y2="' + (h-padB) + '" stroke="var(--line)" stroke-width="1"/>';
    months.forEach(function(m, i){
      var val = byMonth[m];
      var bh = Math.max(3, (val/maxMonth) * (h-padT-padB));
      var x = padL + i*bw + (bw-barW)/2;
      var y = (h-padB) - bh;
      svg += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="var(--brand)"><title>' + m + '：' + yen(val) + '</title></rect>';
      svg += '<text x="' + (x+barW/2).toFixed(1) + '" y="' + (h-padB+14) + '" font-size="9.5" text-anchor="middle">' + m.slice(5) + '月</text>';
    });
    svg += '</svg>';
    return svg;
  }

  /* ================= kakeibo tracker import (支出 + サブスク・固定費) ================= */
  var KAKEIBO_SUB_CATEGORY = 'サブスク・固定費';

  function kakeiboParseDate(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function kakeiboPad2(n){ return n<10 ? '0'+n : ''+n; }
  function kakeiboFmt(d){ return d.getFullYear()+'-'+kakeiboPad2(d.getMonth()+1)+'-'+kakeiboPad2(d.getDate()); }
  function kakeiboMonthEndDay(y,m){ return new Date(y,m,0).getDate(); } // m:1-12
  function kakeiboAddMonths(y,m,n){ var mm=m+n, yy=y; while(mm>12){mm-=12;yy++;} while(mm<1){mm+=12;yy--;} return [yy,mm]; }

  // サブスク・固定費の発生日を fromDate〜toDate の範囲で展開する（トラッカー本体のロジックを踏襲）
  function kakeiboSubOccurrences(sub, fromDate, toDate){
    var start = kakeiboParseDate(sub.start);
    var out = [];
    if (sub.interval === '週次'){
      var d = new Date(start);
      while (d < fromDate){ d.setDate(d.getDate()+7); }
      while (d <= toDate){ out.push(new Date(d)); d.setDate(d.getDate()+7); if (out.length>500) break; }
    } else if (sub.interval === '年次'){
      var y = start.getFullYear();
      while (true){
        var dy = new Date(y, start.getMonth(), Math.min(start.getDate(), kakeiboMonthEndDay(y, start.getMonth()+1)));
        if (dy > toDate) break;
        if (dy >= fromDate) out.push(dy);
        y++;
        if (out.length>200) break;
      }
    } else { // 月次（デフォルト）
      var ym = start.getFullYear(), mm = start.getMonth()+1;
      while (true){
        var day = Math.min(start.getDate(), kakeiboMonthEndDay(ym, mm));
        var dm = new Date(ym, mm-1, day);
        if (dm > toDate) break;
        if (dm >= fromDate) out.push(dm);
        var nm = kakeiboAddMonths(ym, mm, 1); ym = nm[0]; mm = nm[1];
        if (out.length>800) break;
      }
    }
    return out;
  }

  function importKakeibo(data){
    var existingKeys = {};
    STATE.expenses.forEach(function(e){ if (e.sourceKey) existingKeys[e.sourceKey] = true; });
    var added = 0, skippedExisting = 0, skippedIncome = 0, addedSubs = 0;

    (data.transactions || []).forEach(function(t){
      if (t.amount == null) return;
      if (t.amount <= 0) { skippedIncome++; return; } // 入金・精算（マイナス）は支出ではないので対象外
      var key = 'kakeibo:' + t.id;
      if (existingKeys[key]) { skippedExisting++; return; }
      var cat = t.category || 'その他';
      if (STATE.categories.indexOf(cat) === -1) STATE.categories.push(cat);
      STATE.expenses.push({
        id: uid(),
        date: t.date,
        category: cat,
        amount: t.amount,
        memo: [t.method, t.detail].filter(Boolean).join(' ・ '),
        receipt: null,
        status: 'pending',
        reviewComment: '',
        reviewedAt: null,
        createdAt: Date.now(),
        sourceKey: key
      });
      added++;
    });

    // サブスク・固定費：登録済みサブスクの請求予定日を、開始日〜読み込み時点まで展開して取り込む
    var today = new Date(); today.setHours(0,0,0,0);
    (data.subscriptions || []).forEach(function(sub){
      if (!sub || sub.status !== '有効') return;
      if (!sub.start || !sub.amount) return;
      var fromDate = kakeiboParseDate(sub.start);
      var occ = kakeiboSubOccurrences(sub, fromDate, today);
      occ.forEach(function(d){
        var dateStr = kakeiboFmt(d);
        var key = 'kakeiboSub:' + sub.id + ':' + dateStr;
        if (existingKeys[key]) { skippedExisting++; return; }
        if (STATE.categories.indexOf(KAKEIBO_SUB_CATEGORY) === -1) STATE.categories.push(KAKEIBO_SUB_CATEGORY);
        STATE.expenses.push({
          id: uid(),
          date: dateStr,
          category: KAKEIBO_SUB_CATEGORY,
          amount: sub.amount,
          memo: [sub.name, sub.method, sub.memo].filter(Boolean).join(' ・ '),
          receipt: null,
          status: 'pending',
          reviewComment: '',
          reviewedAt: null,
          createdAt: Date.now(),
          sourceKey: key
        });
        added++; addedSubs++;
      });
    });

    return { added: added, skippedExisting: skippedExisting, skippedIncome: skippedIncome, addedSubs: addedSubs };
  }

  function handleKakeiboImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.transactions)) throw new Error("invalid");
        var result = importKakeibo(data);
        renderApp();
        saveState('家計簿トラッカーから読み込みました（新規' + result.added + '件（うちサブスク・固定費' + result.addedSubs + '件）を未審査として追加・既存' + result.skippedExisting + '件はスキップ）');
      } catch(e){
        toast('読み込みに失敗しました。家計簿トラッカーの「バックアップを書き出す」で作ったファイルか確認してください');
      }
    };
    reader.readAsText(file);
  }

  /* ================= modal: new expense ================= */
  function openNewModal(){
    var today = new Date().toISOString().slice(0,10);
    var body = '<h2>新規支出を記録</h2>' +
      '<div class="form-2col">' +
      '<div class="form-row"><label>日付</label><input type="date" id="f-date" value="' + today + '"></div>' +
      '<div class="form-row"><label>費目</label><select id="f-category">' + STATE.categories.map(function(c){return '<option>'+esc(c)+'</option>';}).join('') + '</select></div>' +
      '</div>' +
      '<div class="form-row"><label>金額（円）</label><input type="number" id="f-amount" min="0" step="1" placeholder="0"></div>' +
      '<div class="form-row"><label>内容・メモ</label><textarea id="f-memo" rows="3" placeholder="例）友人とランチ"></textarea></div>' +
      '<div class="form-row"><label>領収書・レシート画像</label><div class="file-drop" id="f-dropzone">クリックして画像を選択<div id="f-preview"></div></div><input type="file" id="f-file" accept="image/*" style="display:none"></div>' +
      '<div class="modal-actions"><button class="btn-ghost" id="f-cancel">キャンセル</button><button class="btn-primary" id="f-submit">記録する</button></div>';
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalOverlay').classList.add('show');

    var receiptData = null;
    document.getElementById('f-dropzone').onclick = function(){ document.getElementById('f-file').click(); };
    document.getElementById('f-file').onchange = function(ev){
      var file = ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        receiptData = reader.result;
        document.getElementById('f-preview').innerHTML = '<img src="' + receiptData + '" alt="プレビュー">';
      };
      reader.readAsDataURL(file);
    };
    document.getElementById('f-cancel').onclick = closeModal;
    document.getElementById('f-submit').onclick = function(){
      var amount = parseFloat(document.getElementById('f-amount').value);
      if (!amount || amount<=0) { toast('金額を正しく入力してください'); return; }
      var e = {
        id: uid(),
        date: document.getElementById('f-date').value,
        category: document.getElementById('f-category').value,
        amount: amount,
        memo: document.getElementById('f-memo').value.trim(),
        receipt: receiptData,
        status: 'pending',
        reviewComment: '',
        reviewedAt: null,
        createdAt: Date.now()
      };
      STATE.expenses.push(e);
      closeModal();
      ui.selectedId = e.id; ui.filter = 'all'; ui.view='review';
      renderApp();
      saveState('新規支出を記録しました');
    };
  }

  /* ================= modal: categories & budgets ================= */
  function catRowsHTML(draft){
    draft = draft || {};
    return STATE.categories.map(function(cat){
      var val = Object.prototype.hasOwnProperty.call(draft, cat) ? draft[cat] : (STATE.budgets[cat]||'');
      return '<div class="budget-form-row" data-cat-row="' + esc(cat) + '"><span class="cat">' + esc(cat) + '</span>' +
        '<input type="number" min="0" step="1" data-budget-cat="' + esc(cat) + '" value="' + val + '" placeholder="0">' +
        '<span class="yen">円 / 月</span>' +
        '<button type="button" class="cat-del" data-cat-del="' + esc(cat) + '" title="この費目を削除">×</button></div>';
    }).join('');
  }

  // 費目の追加・削除で一覧を再描画する際、まだ保存していない入力中の予算額を保持する
  function collectDraftBudgets(){
    var draft = {};
    document.querySelectorAll('[data-budget-cat]').forEach(function(inp){
      var cat = inp.getAttribute('data-budget-cat');
      if (inp.value !== '') draft[cat] = inp.value;
    });
    return draft;
  }

  function refreshCatRows(){
    var draft = collectDraftBudgets();
    document.getElementById('catRows').innerHTML = catRowsHTML(draft);
  }

  function addCategory(){
    var input = document.getElementById('newCatInput');
    var v = input.value.trim();
    if (!v) { toast('費目名を入力してください'); return; }
    if (STATE.categories.indexOf(v) !== -1) { toast('同じ名前の費目が既にあります'); return; }
    STATE.categories.push(v);
    input.value = '';
    refreshCatRows();
  }

  function deleteCategory(cat){
    if (STATE.categories.length <= 1) { toast('費目は最低1つ必要です'); return; }
    var used = STATE.expenses.filter(function(e){ return e.category===cat; }).length;
    var msg = used > 0
      ? ('「' + cat + '」を使った記録が' + used + '件あります。費目を削除しても過去の記録は残りますが、新規記録では選べなくなります。削除しますか？')
      : ('「' + cat + '」を削除しますか？');
    if (!window.confirm(msg)) return;
    STATE.categories = STATE.categories.filter(function(c){ return c !== cat; });
    delete STATE.budgets[cat];
    refreshCatRows();
  }

  function openBudgetModal(){
    var body = '<h2>費目・予算を管理</h2>' +
      '<div class="modal-desc">費目の追加・削除と、費目ごとの毎月の予算上限を設定します。未設定のままだと、その費目は予算チェックの対象になりません。</div>' +
      '<div class="cat-add-row"><input type="text" id="newCatInput" placeholder="新しい費目名（例：サブスク代）"><button type="button" class="btn-ghost-sm" id="newCatAdd">追加</button></div>' +
      '<div id="catRows">' + catRowsHTML() + '</div>' +
      '<div class="modal-actions"><button class="btn-ghost" id="b-cancel">キャンセル</button><button class="btn-primary" id="b-submit">保存する</button></div>';
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalOverlay').classList.add('show');
    document.getElementById('b-cancel').onclick = closeModal;
    document.getElementById('newCatAdd').onclick = addCategory;
    document.getElementById('newCatInput').addEventListener('keydown', function(ev){
      if (ev.key === 'Enter') { ev.preventDefault(); addCategory(); }
    });
    document.getElementById('catRows').addEventListener('click', function(ev){
      var btn = ev.target.closest('[data-cat-del]');
      if (btn) deleteCategory(btn.getAttribute('data-cat-del'));
    });
    document.getElementById('b-submit').onclick = function(){
      document.querySelectorAll('[data-budget-cat]').forEach(function(inp){
        var cat = inp.getAttribute('data-budget-cat');
        var val = parseFloat(inp.value);
        if (val > 0) STATE.budgets[cat] = val;
        else delete STATE.budgets[cat];
      });
      closeModal();
      renderApp();
      saveState('費目・予算を更新しました');
    };
  }

  function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); document.getElementById('modalBody').innerHTML=''; }

  /* ================= actions ================= */
  function doAction(action){
    var e = byId(ui.selectedId);
    if (!e) return;
    var note = (document.getElementById('reviewNote')||{}).value || '';
    note = note.trim();
    if (action==='reject' && !note) {
      toast('無駄遣い認定の理由を入力してください'); return;
    }
    var prevId = e.id;
    e.status = action==='approve' ? 'approved' : 'rejected';
    e.reviewComment = note;
    e.reviewedAt = new Date().toISOString().slice(0,10);

    // 次の未審査項目へ自動的に選択を移動する
    var list = sorted();
    var idx = list.findIndex(function(x){ return x.id === prevId; });
    var next = null;
    for (var i = idx + 1; i < list.length; i++){
      if (list[i].status === 'pending') { next = list[i]; break; }
    }
    if (!next){
      for (var j = 0; j < idx; j++){
        if (list[j].status === 'pending') { next = list[j]; break; }
      }
    }
    ui.selectedId = next ? next.id : null;

    renderApp();
    saveState('ステータスを「' + STATUS[e.status].label + '」に更新しました' + (next ? '。次の未審査項目を表示しています' : ''));
  }

  function deleteExpense(id){
    var e = byId(id);
    if (!e) return;
    if (!window.confirm('この支出の記録を削除しますか？（元に戻せません）')) return;
    STATE.expenses = STATE.expenses.filter(function(x){ return x.id !== id; });
    ui.checked = ui.checked.filter(function(x){ return x !== id; });
    if (ui.selectedId === id) ui.selectedId = null;
    renderApp();
    saveState('支出の記録を削除しました');
  }

  function bulkApprove(){
    if (!ui.checked.length) return;
    var ids = ui.checked.slice();
    if (!window.confirm(ids.length + '件をまとめて承認しますか？')) return;
    var today = new Date().toISOString().slice(0,10);
    STATE.expenses.forEach(function(e){
      if (ids.indexOf(e.id) > -1) {
        e.status = 'approved';
        if (!e.reviewComment) e.reviewComment = '一括承認';
        e.reviewedAt = today;
      }
    });
    ui.checked = [];
    renderApp();
    saveState(ids.length + '件を一括承認しました');
  }

  function bulkDeleteChecked(){
    if (!ui.checked.length) return;
    var ids = ui.checked.slice();
    if (!window.confirm(ids.length + '件をまとめて削除しますか？（元に戻せません）')) return;
    STATE.expenses = STATE.expenses.filter(function(e){ return ids.indexOf(e.id) === -1; });
    if (ids.indexOf(ui.selectedId) > -1) ui.selectedId = null;
    ui.checked = [];
    renderApp();
    saveState(ids.length + '件を一括削除しました');
  }

  /* ================= backup: export / import ================= */
  function downloadBlob(content, type, filename){
    var blob = new Blob([content], {type: type});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  function exportBackup(){
    try {
      var ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
      downloadBlob(JSON.stringify(STATE, null, 2), "application/json", "shishutsu-shinsa-backup-" + ts + ".json");
      toast("バックアップファイルをダウンロードしました");
    } catch(e){
      toast("バックアップの作成に失敗しました");
    }
  }

  function csvField(v){
    var s = String(v==null?"":v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  function exportCsv(){
    try {
      var header = ["種別","日付","費目・収入元","金額","内容・メモ","ステータス","審査コメント","審査日"];
      var expenseRows = sorted().map(function(e){
        return ["支出", e.date, e.category, -Math.abs(e.amount), e.memo, STATUS[e.status].label, e.reviewComment, e.reviewedAt||""].map(csvField).join(",");
      });
      var incomeRows = sortedIncomes().map(function(e){
        return ["収入", e.date, e.source, e.amount, e.memo, "", "", ""].map(csvField).join(",");
      });
      var csv = "﻿" + header.join(",") + "\r\n" + expenseRows.concat(incomeRows).join("\r\n");
      var ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
      downloadBlob(csv, "text/csv;charset=utf-8", "shishutsu-kiroku-" + ts + ".csv");
      toast("CSVファイルをダウンロードしました（収入・支出）");
    } catch(e){
      toast("CSVの作成に失敗しました");
    }
  }

  function importBackup(file){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.expenses)) throw new Error("invalid");
        var ok = window.confirm("バックアップを読み込むと、現在のデータは上書きされます。よろしいですか？");
        if (!ok) return;
        STATE = data;
        if (!STATE.budgets) STATE.budgets = {};
        if (!STATE.categories || !STATE.categories.length) STATE.categories = DEFAULT_CATEGORIES.slice();
        if (!STATE.incomes) STATE.incomes = [];
        ui.selectedId = null;
        renderApp();
        saveState("バックアップから復元しました（" + STATE.expenses.length + " 件）");
      } catch(e){
        toast("読み込みに失敗しました。正しいバックアップファイルか確認してください");
      }
    };
    reader.readAsText(file);
  }

  /* ================= events ================= */
  function bindEvents(){
    document.querySelectorAll('[data-nav]').forEach(function(b){
      b.onclick = function(){ ui.view = b.getAttribute('data-nav'); renderApp(); };
    });
    document.querySelectorAll('[data-filter]').forEach(function(b){
      b.onclick = function(){ ui.filter = b.getAttribute('data-filter'); renderApp(); };
    });
    document.querySelectorAll('[data-select]').forEach(function(b){
      b.onclick = function(){ ui.selectedId = b.getAttribute('data-select'); renderApp(); };
    });
    document.querySelectorAll('[data-action]').forEach(function(b){
      b.onclick = function(){
        var action = b.getAttribute('data-action');
        if (action === 'bulk-approve') { bulkApprove(); return; }
        if (action === 'bulk-delete') { bulkDeleteChecked(); return; }
        if (action === 'bulk-clear') { ui.checked = []; renderApp(); return; }
        doAction(action);
      };
    });
    document.querySelectorAll('[data-check]').forEach(function(cb){
      cb.onclick = function(ev){ ev.stopPropagation(); };
      cb.onchange = function(){
        var id = cb.getAttribute('data-check');
        var idx = ui.checked.indexOf(id);
        if (cb.checked) { if (idx === -1) ui.checked.push(id); }
        else if (idx > -1) { ui.checked.splice(idx, 1); }
        renderApp();
      };
    });
    document.querySelectorAll('[data-expense-del]').forEach(function(b){
      b.onclick = function(ev){ ev.stopPropagation(); deleteExpense(b.getAttribute('data-expense-del')); };
    });
    var zoomImg = document.querySelector('[data-zoom]');
    if (zoomImg) zoomImg.onclick = function(){
      document.getElementById('lightboxImg').src = zoomImg.src;
      document.getElementById('lightbox').classList.add('show');
    };
    var btnNew = document.getElementById('btnNew');
    if (btnNew) btnNew.onclick = openNewModal;
    var btnBudget = document.getElementById('btnBudget');
    if (btnBudget) btnBudget.onclick = openBudgetModal;
    var btnCsv = document.getElementById('btnCsv');
    if (btnCsv) btnCsv.onclick = exportCsv;
    var btnExport = document.getElementById('btnExport');
    if (btnExport) btnExport.onclick = exportBackup;
    var btnImport = document.getElementById('btnImport');
    if (btnImport) btnImport.onclick = function(){ document.getElementById('restoreFile').click(); };
    var dashMonthSel = document.getElementById('dashMonthSel');
    if (dashMonthSel) dashMonthSel.onchange = function(){ ui.dashMonth = dashMonthSel.value; renderApp(); };
    var btnNewIncome = document.getElementById('btnNewIncome');
    if (btnNewIncome) btnNewIncome.onclick = openIncomeModal;
    var btnSalaryImport = document.getElementById('btnSalaryImport');
    if (btnSalaryImport) btnSalaryImport.onclick = function(){ document.getElementById('salaryImportFile').click(); };
    var btnPayslipImport = document.getElementById('btnPayslipImport');
    if (btnPayslipImport) btnPayslipImport.onclick = function(){ document.getElementById('payslipImportFile').click(); };
    var btnKakeiboImport = document.getElementById('btnKakeiboImport');
    if (btnKakeiboImport) btnKakeiboImport.onclick = function(){ document.getElementById('kakeiboImportFile').click(); };
    document.querySelectorAll('[data-income-del]').forEach(function(b){
      b.onclick = function(){ deleteIncome(b.getAttribute('data-income-del')); };
    });
  }
  document.getElementById('modalOverlay').addEventListener('click', function(ev){
    if (ev.target.id === 'modalOverlay') closeModal();
  });
  document.getElementById('lightbox').addEventListener('click', function(){
    document.getElementById('lightbox').classList.remove('show');
  });
  document.getElementById('restoreFile').addEventListener('change', function(ev){
    var file = ev.target.files[0];
    if (file) importBackup(file);
    ev.target.value = "";
  });
  document.getElementById('salaryImportFile').addEventListener('change', function(ev){
    var file = ev.target.files[0];
    if (file) handleSalaryImportFile(file);
    ev.target.value = "";
  });
  document.getElementById('kakeiboImportFile').addEventListener('change', function(ev){
    var file = ev.target.files[0];
    if (file) handleKakeiboImportFile(file);
    ev.target.value = "";
  });
  document.getElementById('payslipImportFile').addEventListener('change', function(ev){
    if (ev.target.files && ev.target.files.length) handlePayslipImportFiles(ev.target.files);
    ev.target.value = "";
  });

  /* ================= persistence (localStorage) ================= */
  function saveState(msg){
    if (msg) toast(msg);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 400);
  }

  function doSave(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      lastSavedAt = new Date();
      saveFailed = false;
      var badge = document.getElementById('saveBadge');
      if (badge) badge.innerHTML = saveBadgeText();
    } catch(e){
      saveFailed = true;
      var badge2 = document.getElementById('saveBadge');
      if (badge2) badge2.innerHTML = saveBadgeText();
      toast("保存に失敗しました。今の変更は保存されていません。バックアップを保存してください");
      window.alert("保存容量の上限に達したため、直前の変更が保存されていません。「設定」タブの「バックアップを保存」で今のデータをすぐに書き出してください。領収書画像を減らすと保存できる可能性があります。");
    }
  }

  /* ================= init ================= */
  renderApp();
})();
</script>
